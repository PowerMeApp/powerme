openapi: 3.1.0
info:
  title: PowerMe CSMS — Driver API
  version: 0.10.0
  summary: Hợp đồng REST cho app tài xế (T77, phiếu v1.3 §3.2g)
  description: |
    Hợp đồng giữa CSMS (WP2) và app tài xế Flutter (WP3) cho trạng thái súng sạc, thời gian còn lại,
    bắt đầu / dừng phiên và theo dõi phiên. Mỗi đường dẫn ánh xạ một hàm đã có trong
    `DriverChargingService` (apps/csms/src/sessions/driver-charging.service.ts) hoặc một hàm sẽ
    thêm ở Tuần 9 (ghi rõ `x-status`). Luật nghiệp vụ dẫn ở từng chỗ: BR-P32, BR-P38, BR-P39,
    BR-P40 (trạng thái và thời gian còn lại), BR-P18, BR-P19 (tín dụng), BR-P45 (làm tròn).

    Quy ước chung:
    - Tiền là số nguyên VND, điện năng là số nguyên Wh, thời gian là ISO 8601 UTC.
    - Số định danh (`*_id`) là số nguyên dương; DB dùng bigint nên trả về dạng **chuỗi số** để
      không mất độ chính xác ở JSON (`"id": "12"`), đúng như hàng `pg` trả hiện nay.
    - Lỗi luôn là `{error, detail}`; `error` là mã ổn định để app rẽ nhánh, `detail` để hiển thị.
    - App **có thể thấy phiên mà nó không tạo ra** (quẹt thẻ RFID online, mật khẩu HMI): các
      đường `sessions/*` trả cả phiên đó nếu `driver_id` khớp; `charges/*` chỉ có với phiên bắt đầu
      từ app.
  x-owner: Trí (WP2) — hợp đồng; Sơn (WP3) — route và client Dart
  x-status: MB03 — brief 07/11 smart station search, address search and canonical road routes implemented locally; BE-21 email/password register, login and refresh implemented; BE-30 login by email or phone number (E.164); BE-22 charges, sessions (progress/stop/statement) and credit implemented; BE-34 vehicle models and add/set-default/remove vehicles (soft delete) implemented; T32 Phần 5 billing/top-ups implemented but not for app use until T32 Phần 8 merges (IPN and return page since T32 Phần 6); time-left remains planned
servers:
  - url: http://localhost:3000/api/driver/v1
    description: CSMS cục bộ (cùng tiến trình với console /api/admin)
tags:
  - name: auth
    description: UC-ACC-01 đăng ký (kèm consent BR-P05), đăng nhập email hoặc số điện thoại + mật khẩu (BE-21, BE-30), làm mới access token
  - name: vehicles
    description: UC-ACC-03 / màn hình 13 Profile & Vehicles — danh mục mẫu xe, thêm / đặt mặc định / gỡ xe của chính tài xế (BE-34)
  - name: stations
    description: UC-CHG-01 tìm trạm, trạng thái từng súng (BR-P38, BR-P39)
  - name: time-left
    description: UC-CHG-04 / FR-03 thời gian còn lại (BR-P32, BR-P40)
  - name: charges
    description: UC-CHG-02 bắt đầu phiên từ app (D4 start intent có idempotency key)
  - name: sessions
    description: UC-CHG-03 dừng, UC-CHG-04 theo dõi, bảng kê sau phiên
  - name: credit
    description: UC-PAY-02 / màn hình 9 — số dư Charging Credit và lịch sử sổ cái của chính tài xế (BE-22)
  - name: top-ups
    description: |
      UC-PAY-01 nạp Charging Credit qua VNPay (WF-02 SD-2a, T32 Phần 5). Dùng được cho app từ
      T32 Phần 8 (quét top-up quá hạn + querydr); IPN cộng tiền và trang return
      `/billing/vnpay/return` có từ T32 Phần 6. Chưa có e-invoice, chưa thử sandbox VNPay thật.

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerDriver
      x-status: implemented — BE-21
      summary: Tạo tài khoản tài xế bằng email + mật khẩu, kèm consent (UC-ACC-01, BR-P05)
      description: |
        Không cần bearer. Thiếu `consent: true` hoặc `consent_version` → 400 `consent_required`,
        không ghi dòng nào. Email được trim + lowercase; trùng (không phân biệt hoa/thường) → 409
        `email_taken`. `phone_number` tuỳ chọn (BE-30): chuẩn hoá về E.164 theo quy tắc ở schema
        `PhoneNumberInput`, không nhận ra → 400 `invalid_input`; số đã có tài khoản (so sau chuẩn
        hoá, mọi định dạng) → 409 `phone_taken`. Email trùng được báo trước số trùng.
        Mật khẩu 8–128 ký tự, không ép quy tắc độ phức tạp. Một transaction tạo
        `users` (role driver, active, mật khẩu băm scrypt) và `drivers` (consent_version,
        consent_given_at = now). Không tạo ví credit/loyalty ở bước này. Trả token như login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Tài khoản đã tạo; access + refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginTokens' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/AuthMethodNotAllowed' }
        '409':
          description: |
            `email_taken` — email đã có tài khoản (không phân biệt hoa/thường);
            `phone_taken` — số điện thoại (sau chuẩn hoá E.164) đã có tài khoản (BE-30)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                email_taken: { value: { error: email_taken, detail: email_taken } }
                phone_taken: { value: { error: phone_taken, detail: phone_taken } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [auth]
      operationId: loginDriver
      x-status: implemented — BE-21 (email), BE-30 (số điện thoại)
      summary: Đăng nhập bằng email HOẶC số điện thoại + mật khẩu, nhận access token (900 s) và refresh token
      description: |
        Body có đúng MỘT định danh: `{email, password}` (như BE-21, không đổi) hoặc
        `{phone_number, password}` (BE-30). Có cả hai khoá (kể cả giá trị null) hoặc không có khoá
        nào → 400 `invalid_input`. Số điện thoại được chuẩn hoá như khi đăng ký (`PhoneNumberInput`),
        nên `0901234567`, `+84 901 234 567`, `84901234567` cùng là một tài khoản.

        Sai định danh và sai mật khẩu trả cùng 401 `invalid_credentials` (không phân biệt; khi không
        có user — kể cả số không chuẩn hoá được — CSMS vẫn băm một lần để thời gian tương đương).
        User không phải driver hoặc chưa có dòng `drivers` cũng là `invalid_credentials`. Tài khoản
        `suspended`/`closed` (F-13) → 403 `account_locked`, chỉ trả khi mật khẩu đúng. 5 lần sai /
        60 s theo định danh đã chuẩn hoá + IP (hoặc 20 lần theo IP) → 429 `too_many_attempts` trong
        15 phút, kể cả khi mật khẩu đúng; email và số của cùng một tài khoản đếm riêng; bộ đếm trong
        bộ nhớ một tiến trình. Không có OTP/SMS hay đăng nhập Google (ngoài phạm vi, ADR-0017).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              email: { value: { email: app.ds01@powerme.test, password: '<mật khẩu>' } }
              phone_e164: { value: { phone_number: '+84900000101', password: '<mật khẩu>' } }
              phone_local: { value: { phone_number: '0900 000 101', password: '<mật khẩu>' } }
      responses:
        '200':
          description: Access + refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginTokens' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '401':
          description: '`invalid_credentials` — sai email / số điện thoại hoặc mật khẩu (cùng một mã)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/AuthMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshDriverAccessToken
      x-status: implemented — BE-21
      summary: Đổi refresh token lấy access token mới (không phát refresh token mới)
      description: |
        Refresh token là JWT HS256 riêng (header `typ: refresh+jwt`, claim `token_use: refresh`,
        không có `role`), sống `DRIVER_API_REFRESH_TTL_S` (mặc định 30 ngày) tính từ lúc đăng nhập.
        Access token không dùng làm refresh và ngược lại. Mỗi lần refresh kiểm lại DB: role driver,
        có dòng `drivers`, `account_status = active`. Không có bảng refresh token nên không thu hồi
        từng token; logout = app xoá token. Hết hạn refresh → đăng nhập lại.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Access token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '401':
          description: '`invalid_refresh_token` — sai chữ ký, hết hạn, sai loại token hoặc user không còn'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/AuthMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /places/autocomplete:
    get:
      tags: [stations]
      operationId: autocompleteDriverAddress
      x-status: implemented — MB03 road slice
      summary: Server-side Vietmap address candidates, separate from PowerMe inventory
      description: |
        Requires an owned vehicle and explicit consent. Coordinates are optional together.
        Cache is principal-scoped, in memory for 120 seconds; all HTTP responses are no-store.
        Unknown or repeated parameters are rejected. No provider key, URL or raw body is returned.
      parameters:
        - $ref: '#/components/parameters/vehicleId'
        - $ref: '#/components/parameters/locationConsent'
        - $ref: '#/components/parameters/originLatitude'
        - $ref: '#/components/parameters/originLongitude'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Address candidates, not station IDs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressSearchResult' }
        '400': { $ref: '#/components/responses/RoadBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/ProviderBusy' }
        '503': { $ref: '#/components/responses/RoadUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /places/resolve:
    get:
      tags: [stations]
      operationId: resolveDriverAddress
      x-status: implemented — MB03 road slice
      summary: Resolve a provider ref_id to address coordinates
      parameters:
        - $ref: '#/components/parameters/vehicleId'
        - $ref: '#/components/parameters/locationConsent'
        - name: ref_id
          in: query
          required: true
          schema: { type: string, pattern: '^(auto|geocode):[A-Za-z0-9_-]{1,2048}$' }
      responses:
        '200':
          description: Resolved address; cannot substitute for a canonical station destination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceSearchResult' }
        '400': { $ref: '#/components/responses/RoadBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/ProviderBusy' }
        '503': { $ref: '#/components/responses/RoadUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /stations/{site_id}/route:
    get:
      tags: [stations]
      operationId: getDriverStationRoadRoute
      x-status: implemented — MB03 road slice
      summary: Road route to a compatible canonical DB station
      description: |
        Requires owned vehicle and consented origin coordinates. Destination is read from DB;
        arbitrary coordinates/URLs are rejected. Geometry is GeoJSON longitude/latitude, never
        an encoded polyline or straight-line fallback. Traffic quality remains unknown.
        Provider failure returns sanitized 503. Disconnect only cancels that caller's wait;
        shared provider work remains bounded by its 5-second timeout.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/vehicleId'
        - $ref: '#/components/parameters/locationConsent'
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - $ref: '#/components/parameters/roadVinfastOverride'
      responses:
        '200':
          description: Provider road estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationRoadRoute' }
        '400': { $ref: '#/components/responses/RoadBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/ProviderBusy' }
        '503': { $ref: '#/components/responses/RoadUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [stations]
      operationId: getOwnDriverBootstrap
      summary: Hồ sơ tối thiểu và xe thuộc tài xế đang đăng nhập
      x-status: implemented — MB03 backend discovery slice
      description: |
        Chỉ đọc tài xế từ JWT và DB, không nhận identity từ query. Token lấy từ `/auth/login`,
        `/auth/register` hoặc `/auth/refresh` (BE-21). Không có OTP, cập nhật profile hoặc
        truy vấn phiên trong slice này. `vehicles[]` chỉ gồm xe **chưa gỡ** (BE-34), xe mặc định
        đứng đầu rồi theo thứ tự thêm; thêm / gỡ / đổi mặc định qua `/vehicles` (BE-34).
      responses:
        '200':
          description: Own driver and vehicles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverBootstrap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vehicle-models:
    get:
      tags: [vehicles]
      operationId: listVehicleModels
      x-status: implemented — BE-34
      summary: Danh mục mẫu xe để chọn khi thêm xe
      description: |
        Mọi mẫu trong `vehicle_models`, sắp theo hãng rồi tên mẫu. Không nhận query (có → 400
        `invalid_input`). `is_vinfast` quyết định bộ lọc trạm VinFast-only (BR-P03);
        `connector_type` quyết định súng tương thích. Số đo có thể null (mẫu thiếu thông số →
        gợi ý trạm trả `smart_unavailable_reason = missing_vehicle_specs`).
      responses:
        '200':
          description: Danh mục mẫu xe
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VehicleModel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vehicles:
    post:
      tags: [vehicles]
      operationId: addVehicle
      x-status: implemented — BE-34
      summary: Thêm xe cho tài xế đang đăng nhập
      description: |
        Body `application/json` ≤ 16 KiB, trường lạ → 400 `invalid_input`; `vehicle_model_id` là
        **chuỗi** số. Không có query.

        **Biển số:** NFKC, in hoa, bỏ mọi khoảng trắng; giữ `-` và `.` để hiển thị
        (`" 51k-901.01 "` → `"51K-901.01"`). Chỉ chữ A–Z, số, `-`/`.` ở giữa (không hai dấu liền
        nhau); dạng lưu ≤ 12 ký tự; phần chữ + số 5–10 ký tự. Sai → 400 `invalid_plate_number`.
        So trùng theo phần chữ + số: `51K-901.01`, `51k 901.01`, `51K90101` là MỘT biển. Biển đang
        thuộc một xe chưa gỡ của **bất kỳ ai** (kể cả chính tài xế) → 409 `plate_taken` (không cho
        biết xe của ai). Biển của xe đã gỡ đăng ký lại được.

        **Xe mặc định:** tài xế chưa có xe mặc định (xe đầu tiên) → xe mới là mặc định bất kể
        `is_default`; `is_default: true` → xe mới thành mặc định, xe mặc định cũ thôi (một
        transaction, luôn đúng một xe mặc định).

        **Không có `Idempotency-Key`:** biển số là khoá tự nhiên. Mất phản hồi rồi gửi lại → 409
        `plate_taken`, không tạo xe thứ hai; app tải lại `GET /me` để thấy xe đã thêm.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddVehicleRequest' }
            examples:
              vf8:
                value: { plate_number: '51K-901.01', vehicle_model_id: '4', is_default: true }
      responses:
        '201':
          description: Xe vừa thêm — cùng hình dạng phần tử `vehicles[]` của `/me`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnVehicle' }
        '400':
          description: |
            `invalid_input` (JSON hỏng, không phải object, trường lạ, `vehicle_model_id` không phải
            chuỗi số, `is_default` không phải boolean, có query); `invalid_plate_number`;
            `unknown_vehicle_model` (không có mẫu xe với id đó)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/PostOnly' }
        '409':
          description: '`plate_taken` — biển đã thuộc một xe chưa gỡ (của bất kỳ ai)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vehicles/{vehicle_id}:
    parameters:
      - name: vehicle_id
        in: path
        required: true
        description: Chuỗi số; sai dạng → 400 `invalid_input`
        schema: { $ref: '#/components/schemas/Id' }
    patch:
      tags: [vehicles]
      operationId: setDefaultVehicle
      x-status: implemented — BE-34
      summary: Đặt xe làm xe mặc định
      description: |
        Body đúng `{"is_default": true}` (gì khác, kể cả `false`, → 400 `invalid_input`; muốn bỏ
        cờ mặc định thì đặt xe khác làm mặc định). Xe mặc định cũ thôi trong cùng transaction. Xe
        đã là mặc định → 200, không đổi gì. Xe không có / của tài xế khác / đã gỡ → 404 như nhau.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDefaultVehicleRequest' }
      responses:
        '200':
          description: Xe sau khi đặt mặc định
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnVehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405':
          description: '`method_not_allowed`, Allow PATCH, DELETE, OPTIONS'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [vehicles]
      operationId: removeVehicle
      x-status: implemented — BE-34
      summary: Gỡ xe (xoá mềm, giữ lịch sử phiên)
      description: |
        Không body. Xe không bị xoá khỏi DB: `removed_at` được ghi (migration 0018), lịch sử phiên
        và yêu cầu sạc vẫn trỏ tới xe (BR-P17). Sau khi gỡ, xe biến khỏi `/me`; dùng `vehicle_id`
        đó ở `/stations`, `/connectors/by-code`, `/places/*`, `/stations/{site_id}/route`,
        `PATCH`/`DELETE /vehicles/{id}` → 404 `not_found`, ở `POST /charges` → 400
        `vehicle_not_owned_or_incompatible`. Biển số được giải phóng.

        Xe còn yêu cầu sạc chưa xong (intent chưa `rejected`/`settled`/`released`, gồm cả phiên đã
        dừng nhưng chưa quyết toán) hoặc phiên chưa kết thúc (`pending`, `active`, `paused`,
        `stopping`, `orphaned`) → 409 `vehicle_in_use`.

        Gỡ xe mặc định mà còn xe khác → xe còn lại **thêm sớm nhất** thành mặc định. Gỡ xe cuối
        cùng → `vehicles[]` rỗng; xe thêm sau đó tự thành mặc định. App: sau 204 tải lại `/me`; nếu
        đang lưu `vehicle_id` đã gỡ để tìm trạm thì chuyển sang xe mặc định mới (hoặc yêu cầu thêm
        xe nếu không còn xe).
      responses:
        '204': { description: Đã gỡ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405':
          description: '`method_not_allowed`, Allow PATCH, DELETE, OPTIONS'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`vehicle_in_use` — xe đang có yêu cầu sạc chưa xong hoặc phiên chưa kết thúc'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /stations:
    get:
      tags: [stations]
      operationId: searchStations
      x-status: implemented — MB03 backend discovery slice
      summary: Tìm và gợi ý trạm theo pin, loại xe và tổng thời gian sạc xong
      description: |
        Ánh xạ `DriverChargingService.findStations` → `searchStations` (station-search.ts).
        Chỉ trả súng cùng chuẩn đầu cắm với xe `vehicle_id`. Trạm chỉ dành VinFast bị ẩn khi
        xe không phải VinFast, trừ khi `include_vinfast_only=true` (BR-P03).
        `driver_status` theo BR-P38; `status_quality` theo BR-P39 (quá 2 chu kỳ heartbeat là
        `stale`, mặc định 600 s; quá ngưỡng offline 900 s là `offline`).
        Brief 07/11 được người dùng ưu tiên cho MVP, thay thuật toán SRS §3.7/AD-5 cũ.
        Có SoC và vị trí thì mặc định smart: reach ok → tight → risky, tổng phút, khoảng cách,
        site_id. Chọn súng tương thích có tổng phút thấp nhất, tính toàn bộ ứng viên trong bán kính
        trước khi cắt trang. Không có SoC/vị trí/thông số xe thì estimate=null và nêu lý do fallback.
        distance_m là haversine; đường ước tính = distance_m × road_factor, không gọi Vietmap để
        xếp hạng. Route Vietmap thật nằm ở /stations/{site_id}/route, traffic vẫn unknown.
        Bán kính rõ ràng giữ nguyên; smart không truyền bán kính dùng est_range_km × radius_factor.
        Nếu bán kính ngầm không có trạm, lấy tối đa fallback_limit trạm gần nhất (ưu tiên có thể
        tính thời gian); không mở rộng bán kính người dùng đã nhập. Smart không bảo đảm top ba
        toàn mạng ngoài bán kính. UI lấy page_size=3 nếu muốn ba gợi ý.
        Tham số lạ/trùng, chuỗi điều khiển, SoC không hữu hạn hoặc không thỏa 0≤soc<target≤80 trả 400.
        Súng đang có sự cố mở (`fault_events.status` khác `resolved`) bị ẩn khỏi kết quả (WF-04,
        AD-7); sự cố cả trụ (`connector_id` null, vd. `Offline`) ẩn mọi súng của trụ đó. Trạm không
        còn súng nào thì không xuất hiện và không tính vào `total`. Áp dụng cho mọi kiểu sắp xếp,
        kể cả smart và danh sách trạm gần nhất dự phòng, nên súng lỗi không bao giờ là
        `best_connector_id`. Sự cố do tài xế báo (`driver_report`, BR-P42) cũng ẩn súng. Sự cố `resolved`
        thì súng hiện lại.
      parameters:
        - $ref: '#/components/parameters/vehicleId'
        - name: q
          in: query
          description: Chuỗi tìm theo tên trạm hoặc địa chỉ, tối đa 120 ký tự
          schema: { type: string, maxLength: 120 }
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radius_km
          in: query
          description: Chỉ dùng khi có toạ độ
          schema: { type: number, exclusiveMinimum: 0, maximum: 20040 }
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, available, in_use, freeing_soon, unavailable, offline]
            default: all
        - name: sort
          in: query
          description: Mặc định smart khi có SoC và toạ độ; nếu không thì distance khi có toạ độ, name khi không
          schema: { type: string, enum: [name, distance, smart] }
        - name: soc_percent
          in: query
          description: Pin do tài xế nhập; hữu hạn, 0 ≤ soc < target. Không tự đọc SoC phiên cũ.
          schema: { type: number, minimum: 0, exclusiveMaximum: 80 }
        - name: target_soc_percent
          in: query
          description: Hữu hạn, phải lớn hơn soc_percent nếu có; tối đa 80 ở MVP.
          schema: { type: number, exclusiveMinimum: 0, maximum: 80, default: 80 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: include_vinfast_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '404':
          description: Xe không thuộc tài xế (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

