openapi: 3.1.0
info:
  title: PowerMe CSMS — Driver API
  version: 0.6.0
  summary: Hợp đồng REST cho app tài xế (T77, phiếu v1.3 §3.2g)
  description: |
    Hợp đồng giữa CSMS (WP2) và app tài xế Flutter (WP3) cho trạng thái súng sạc, thời gian còn lại,
    bắt đầu / dừng phiên và theo dõi phiên. Mỗi đường dẫn ánh xạ một hàm đã có trong
    `DriverChargingService` (apps/csms/src/sessions/driver-charging.service.ts) hoặc một hàm sẽ
    thêm ở Tuần 9 (ghi rõ `x-status`). Luật nghiệp vụ dẫn ở từng chỗ: BR-P32, BR-P38, BR-P39,
    BR-P40 (trạng thái và thời gian còn lại), BR-P18, BR-P19 (tín dụng), BR-P45 (làm tròn).

    Quy ước chung:
    - Tiền là số nguyên VND, điện năng là số nguyên Wh, thời gian là ISO 8601 UTC.
    - Số định danh (`*_id`) là số nguyên dương; DB dùng bigint nên trả về dạng **chuỗi số** để
      không mất độ chính xác ở JSON (`"id": "12"`), đúng như hàng `pg` trả hiện nay.
    - Lỗi luôn là `{error, detail}`; `error` là mã ổn định để app rẽ nhánh, `detail` để hiển thị.
    - App **có thể thấy phiên mà nó không tạo ra** (quẹt thẻ RFID online, mật khẩu HMI): các
      đường `sessions/*` trả cả phiên đó nếu `driver_id` khớp; `charges/*` chỉ có với phiên bắt đầu
      từ app.
  x-owner: Trí (WP2) — hợp đồng; Sơn (WP3) — route và client Dart
  x-status: MB03 — brief 07/11 smart station search, address search and canonical road routes implemented locally; BE-21 email/password register, login and refresh implemented; BE-22 charges, sessions (progress/stop/statement) and credit implemented; time-left remains planned
servers:
  - url: http://localhost:3000/api/driver/v1
    description: CSMS cục bộ (cùng tiến trình với console /api/admin)
tags:
  - name: auth
    description: UC-ACC-01 đăng ký (kèm consent BR-P05), đăng nhập email + mật khẩu, làm mới access token (BE-21)
  - name: stations
    description: UC-CHG-01 tìm trạm, trạng thái từng súng (BR-P38, BR-P39)
  - name: time-left
    description: UC-CHG-04 / FR-03 thời gian còn lại (BR-P32, BR-P40)
  - name: charges
    description: UC-CHG-02 bắt đầu phiên từ app (D4 start intent có idempotency key)
  - name: sessions
    description: UC-CHG-03 dừng, UC-CHG-04 theo dõi, bảng kê sau phiên
  - name: credit
    description: UC-PAY-02 / màn hình 9 — số dư Charging Credit và lịch sử sổ cái của chính tài xế (BE-22)

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerDriver
      x-status: implemented — BE-21
      summary: Tạo tài khoản tài xế bằng email + mật khẩu, kèm consent (UC-ACC-01, BR-P05)
      description: |
        Không cần bearer. Thiếu `consent: true` hoặc `consent_version` → 400 `consent_required`,
        không ghi dòng nào. Email được trim + lowercase; trùng (không phân biệt hoa/thường) → 409
        `email_taken`. Mật khẩu 8–128 ký tự, không ép quy tắc độ phức tạp. Một transaction tạo
        `users` (role driver, active, mật khẩu băm scrypt) và `drivers` (consent_version,
        consent_given_at = now). Không tạo ví credit/loyalty ở bước này. Trả token như login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Tài khoản đã tạo; access + refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginTokens' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/AuthMethodNotAllowed' }
        '409':
          description: '`email_taken` — email đã có tài khoản (không phân biệt hoa/thường)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [auth]
      operationId: loginDriver
      x-status: implemented — BE-21
      summary: Đăng nhập email + mật khẩu, nhận access token (900 s) và refresh token
      description: |
        Sai email và sai mật khẩu trả cùng 401 `invalid_credentials` (không phân biệt; khi không có
        user CSMS vẫn băm một lần để thời gian tương đương). User không phải driver hoặc chưa có
        dòng `drivers` cũng là `invalid_credentials`. Tài khoản `suspended`/`closed` (F-13) → 403
        `account_locked`, chỉ trả khi mật khẩu đúng. 5 lần sai / 60 s theo email + IP (hoặc 20 lần
        theo IP) → 429 `too_many_attempts` trong 15 phút, kể cả khi mật khẩu đúng; bộ đếm trong
        bộ nhớ một tiến trình.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access + refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginTokens' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '401':
          description: '`invalid_credentials` — sai email hoặc mật khẩu (cùng một mã)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/AuthMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshDriverAccessToken
      x-status: implemented — BE-21
      summary: Đổi refresh token lấy access token mới (không phát refresh token mới)
      description: |
        Refresh token là JWT HS256 riêng (header `typ: refresh+jwt`, claim `token_use: refresh`,
        không có `role`), sống `DRIVER_API_REFRESH_TTL_S` (mặc định 30 ngày) tính từ lúc đăng nhập.
        Access token không dùng làm refresh và ngược lại. Mỗi lần refresh kiểm lại DB: role driver,
        có dòng `drivers`, `account_status = active`. Không có bảng refresh token nên không thu hồi
        từng token; logout = app xoá token. Hết hạn refresh → đăng nhập lại.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Access token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '401':
          description: '`invalid_refresh_token` — sai chữ ký, hết hạn, sai loại token hoặc user không còn'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/AuthMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /places/autocomplete:
    get:
      tags: [stations]
      operationId: autocompleteDriverAddress
      x-status: implemented — MB03 road slice
      summary: Server-side Vietmap address candidates, separate from PowerMe inventory
      description: |
        Requires an owned vehicle and explicit consent. Coordinates are optional together.
        Cache is principal-scoped, in memory for 120 seconds; all HTTP responses are no-store.
        Unknown or repeated parameters are rejected. No provider key, URL or raw body is returned.
      parameters:
        - $ref: '#/components/parameters/vehicleId'
        - $ref: '#/components/parameters/locationConsent'
        - $ref: '#/components/parameters/originLatitude'
        - $ref: '#/components/parameters/originLongitude'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Address candidates, not station IDs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressSearchResult' }
        '400': { $ref: '#/components/responses/RoadBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/ProviderBusy' }
        '503': { $ref: '#/components/responses/RoadUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /places/resolve:
    get:
      tags: [stations]
      operationId: resolveDriverAddress
      x-status: implemented — MB03 road slice
      summary: Resolve a provider ref_id to address coordinates
      parameters:
        - $ref: '#/components/parameters/vehicleId'
        - $ref: '#/components/parameters/locationConsent'
        - name: ref_id
          in: query
          required: true
          schema: { type: string, pattern: '^(auto|geocode):[A-Za-z0-9_-]{1,2048}$' }
      responses:
        '200':
          description: Resolved address; cannot substitute for a canonical station destination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceSearchResult' }
        '400': { $ref: '#/components/responses/RoadBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/ProviderBusy' }
        '503': { $ref: '#/components/responses/RoadUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /stations/{site_id}/route:
    get:
      tags: [stations]
      operationId: getDriverStationRoadRoute
      x-status: implemented — MB03 road slice
      summary: Road route to a compatible canonical DB station
      description: |
        Requires owned vehicle and consented origin coordinates. Destination is read from DB;
        arbitrary coordinates/URLs are rejected. Geometry is GeoJSON longitude/latitude, never
        an encoded polyline or straight-line fallback. Traffic quality remains unknown.
        Provider failure returns sanitized 503. Disconnect only cancels that caller's wait;
        shared provider work remains bounded by its 5-second timeout.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/vehicleId'
        - $ref: '#/components/parameters/locationConsent'
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - $ref: '#/components/parameters/roadVinfastOverride'
      responses:
        '200':
          description: Provider road estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationRoadRoute' }
        '400': { $ref: '#/components/responses/RoadBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/ProviderBusy' }
        '503': { $ref: '#/components/responses/RoadUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [stations]
      operationId: getOwnDriverBootstrap
      summary: Hồ sơ tối thiểu và xe thuộc tài xế đang đăng nhập
      x-status: implemented — MB03 backend discovery slice
      description: |
        Chỉ đọc tài xế từ JWT và DB, không nhận identity từ query. Token lấy từ `/auth/login`,
        `/auth/register` hoặc `/auth/refresh` (BE-21). Không có OTP, cập nhật profile/xe hoặc
        truy vấn phiên trong slice này.
      responses:
        '200':
          description: Own driver and vehicles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverBootstrap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /stations:
    get:
      tags: [stations]
      operationId: searchStations
      x-status: implemented — MB03 backend discovery slice
      summary: Tìm và gợi ý trạm theo pin, loại xe và tổng thời gian sạc xong
      description: |
        Ánh xạ `DriverChargingService.findStations` → `searchStations` (station-search.ts).
        Chỉ trả súng cùng chuẩn đầu cắm với xe `vehicle_id`. Trạm chỉ dành VinFast bị ẩn khi
        xe không phải VinFast, trừ khi `include_vinfast_only=true` (BR-P03).
        `driver_status` theo BR-P38; `status_quality` theo BR-P39 (quá 2 chu kỳ heartbeat là
        `stale`, mặc định 600 s; quá ngưỡng offline 900 s là `offline`).
        Brief 07/11 được người dùng ưu tiên cho MVP, thay thuật toán SRS §3.7/AD-5 cũ.
        Có SoC và vị trí thì mặc định smart: reach ok → tight → risky, tổng phút, khoảng cách,
        site_id. Chọn súng tương thích có tổng phút thấp nhất, tính toàn bộ ứng viên trong bán kính
        trước khi cắt trang. Không có SoC/vị trí/thông số xe thì estimate=null và nêu lý do fallback.
        distance_m là haversine; đường ước tính = distance_m × road_factor, không gọi Vietmap để
        xếp hạng. Route Vietmap thật nằm ở /stations/{site_id}/route, traffic vẫn unknown.
        Bán kính rõ ràng giữ nguyên; smart không truyền bán kính dùng est_range_km × radius_factor.
        Nếu bán kính ngầm không có trạm, lấy tối đa fallback_limit trạm gần nhất (ưu tiên có thể
        tính thời gian); không mở rộng bán kính người dùng đã nhập. Smart không bảo đảm top ba
        toàn mạng ngoài bán kính. UI lấy page_size=3 nếu muốn ba gợi ý.
        Tham số lạ/trùng, chuỗi điều khiển, SoC không hữu hạn hoặc không thỏa 0≤soc<target≤80 trả 400.
        Súng đang có sự cố mở (`fault_events.status` khác `resolved`) bị ẩn khỏi kết quả (WF-04,
        AD-7); sự cố cả trụ (`connector_id` null, vd. `Offline`) ẩn mọi súng của trụ đó. Trạm không
        còn súng nào thì không xuất hiện và không tính vào `total`. Áp dụng cho mọi kiểu sắp xếp,
        kể cả smart và danh sách trạm gần nhất dự phòng, nên súng lỗi không bao giờ là
        `best_connector_id`. Sự cố do tài xế báo (`driver_report`) không ẩn súng. Sự cố `resolved`
        thì súng hiện lại.
      parameters:
        - $ref: '#/components/parameters/vehicleId'
        - name: q
          in: query
          description: Chuỗi tìm theo tên trạm hoặc địa chỉ, tối đa 120 ký tự
          schema: { type: string, maxLength: 120 }
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radius_km
          in: query
          description: Chỉ dùng khi có toạ độ
          schema: { type: number, exclusiveMinimum: 0, maximum: 20040 }
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, available, in_use, freeing_soon, unavailable, offline]
            default: all
        - name: sort
          in: query
          description: Mặc định smart khi có SoC và toạ độ; nếu không thì distance khi có toạ độ, name khi không
          schema: { type: string, enum: [name, distance, smart] }
        - name: soc_percent
          in: query
          description: Pin do tài xế nhập; hữu hạn, 0 ≤ soc < target. Không tự đọc SoC phiên cũ.
          schema: { type: number, minimum: 0, exclusiveMaximum: 80 }
        - name: target_soc_percent
          in: query
          description: Hữu hạn, phải lớn hơn soc_percent nếu có; tối đa 80 ở MVP.
          schema: { type: number, exclusiveMinimum: 0, maximum: 80, default: 80 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: include_vinfast_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '404':
          description: Xe không thuộc tài xế (`not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /connectors/by-code/{displayCode}/{connectorNo}:
    get:
      tags: [stations]
      operationId: resolveConnectorByCode
      x-status: implemented — MB03 backend discovery slice
      summary: Đổi mã in trên trụ (QR) thành súng cụ thể
      description: |
        Ánh xạ `DriverChargingService.resolveConnector`. Mã QR trên màn hình trụ chứa
        `display_code` của trụ và số súng 1 hoặc 2 (BR-P10). Chỉ trả súng cùng chuẩn với xe và
        trụ đang `in_service` của operator `active`.
      parameters:
        - name: displayCode
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: connectorNo
          in: path
          required: true
          schema: { type: integer, enum: [1, 2] }
        - $ref: '#/components/parameters/vehicleId'
      responses:
        '200':
          description: Súng tìm thấy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /connectors/{connectorId}/time-left:
    get:
      tags: [time-left]
      operationId: getConnectorTimeLeft
      summary: Thời gian còn lại ước tính của súng đang bận
      description: |
        FR-03, BR-P32, BR-P40. Luôn là **khoảng** `[min_minutes, max_minutes]` hoặc `unknown`,
        không bao giờ là một mốc hứa. Mức ước tính lấy theo thứ tự có dữ liệu: hạn mức của phiên
        (`limit`), SoC với đường cong sạc DC (`soc_curve`), lịch sử trụ (`history`), còn lại
        `unknown`. Súng đang `available` trả `kind: unknown` với `reason: not_in_use`.
      x-status: Tuần 9 — hàm ước tính chưa có trên `main`; hình dạng trả về chốt ở đây để WP3 làm UI trước
      parameters:
        - name: connectorId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Ước tính hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeLeftEstimate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /charges:
    post:
      tags: [charges]
      operationId: startCharge
      x-status: implemented — BE-22
      summary: Yêu cầu bắt đầu phiên từ app
      description: |
        Ánh xạ `DriverChargingService.start(driverId, key, input)`. Tạo **start intent** bền
        trước khi gửi RemoteStartTransaction (quyết định D4). Gọi lại cùng `Idempotency-Key` và
        cùng body trả về cùng snapshot; cùng key khác body → 409 `idempotency_conflict`.
        Kiểm tra tín dụng theo BR-P18 (đủ mức khởi đầu) và giữ trước `reserved_vnd`; CSMS tự dừng
        khi chạm mức dự trữ cắt (BR-P19). Chỉ có chế độ `energy_kwh` (hạn mức kWh); các chế độ
        khác là hướng phát triển (README WP3).

        BE-22: body `application/json` ≤ 16 KiB, trường lạ → 400 `invalid_input`; `connector_id`,
        `vehicle_id` là **chuỗi** số. Request trả về khi lệnh RemoteStart đã có kết quả (tối đa
        `CHARGE_COMMAND_TIMEOUT_MS`, mặc định 30 s). **Tín dụng không đủ không phải lỗi HTTP**: intent
        được ghi ở trạng thái từ chối và trả 202 với `outcome = topuprequired` (dưới mức khởi đầu)
        hoặc `requiresconfirmation` (đủ mức khởi đầu nhưng không đủ cho hạn mức xin; `max_energy_wh`
        là hạn mức tối đa CSMS đề nghị — app hỏi tài xế rồi gửi **key mới** với
        `energy_limit_wh = max_energy_wh`). Gửi lại cùng key trả lại đúng kết quả đó.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartChargeRequest' }
      responses:
        '202':
          description: Intent đã ghi; lệnh có thể đang gửi hoặc đã có kết quả — xem `outcome`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargeSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/PostOnly' }
        '409':
          description: |
            `idempotency_conflict` (cùng key khác body); `credit_unavailable` (tài xế **chưa có ví**
            hoặc ví không `active` — số dư thấp đi qua 202 `topuprequired`); `connector_unavailable`
            (không có súng đó, trụ offline / không `in_service`, operator ngừng, hoặc súng không ở
            Available/Preparing — kể cả đang Charging); `connector_busy_or_unknown` (BR-P12: còn
            intent/phiên mở trên súng, hoặc chưa có Available sau phiên trước); `tariff_unavailable`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/PolicyUnconfigured' }

  /charges/{idempotencyKey}:
    get:
      tags: [charges]
      operationId: getChargeStart
      x-status: implemented — BE-22
      summary: Xem lại kết quả một yêu cầu bắt đầu
      description: |
        Ánh xạ `DriverChargingService.getStart`. App gọi khi mất mạng giữa chừng hoặc mở lại
        màn hình. Khi `session_id` khác null, chuyển sang `GET /sessions/{sessionId}/progress`.
        BE-22: key thuộc từng tài xế — key của tài xế khác → 404 như key không tồn tại. Poll mỗi
        1–2 s, dừng khi `session_id` khác null hoặc `outcome` là trạng thái kết thúc
        (`rejected`, `released`, `start_timeout`, `topuprequired`, `requiresconfirmation`).
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IdempotencyKey' }
      responses:
        '200':
          description: Snapshot hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargeSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /sessions/{sessionId}/progress:
    get:
      tags: [sessions]
      operationId: getSessionProgress
      x-status: implemented — BE-22 (`time_left` luôn null cho đến khi có hàm ước tính)
      summary: Tiến trình phiên đang chạy hoặc vừa dừng
      description: |
        Ánh xạ `DriverChargingService.progress`. Trả cho mọi phiên có `driver_id` là tài xế gọi,
        kể cả phiên bắt đầu bằng thẻ RFID online. `consumed_wh` lấy từ `energy_wh` khi phiên đã
        dừng, hoặc từ mẫu đo mới nhất trừ `meter_start_wh` khi đang chạy; `telemetry_quality`
        là `unknown` khi chưa có mẫu hoặc mẫu không hợp lệ.
        Ngưỡng M3 của WP3: SoC và kWh lên app trong vài giây sau MeterValues → app **poll mỗi 5 s**
        cho đến khi có kênh realtime (Tuần 10, ngoài hợp đồng này).
        BE-22: phiên không do app tạo có `reserved_vnd = null`. Ngừng poll khi `status` là
        `closed`/`reconciled` và `settlement_state = posted` (khi đó gọi statement), hoặc `review`.
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Tiến trình
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /sessions/{sessionId}/stop:
    post:
      tags: [sessions]
      operationId: stopCharge
      x-status: implemented — BE-22
      summary: Yêu cầu dừng phiên từ app
      description: |
        Ánh xạ `DriverChargingService.stop(driverId, key, sessionId)`. Ghi **stop intent** rồi
        gửi RemoteStopTransaction; phiên kết thúc thật bằng StopTransaction của trụ (BR-P01).
        Key bắt đầu bằng `limit:` là dành riêng cho CSMS tự cắt (BR-P19) → 400
        `reserved_idempotency_key`.

        BE-22: không có body (nếu gửi thì bị bỏ qua, ≤ 16 KiB). Gọi lại cùng key → cùng
        `command_id`, không gửi RemoteStop lần hai. Chỉ dừng được phiên **bắt đầu từ app**; phiên
        thẻ RFID / HMI → 404 (dừng tại trụ). `command_status = accepted` chưa phải đã dừng: poll
        progress tới khi `meter_stop_wh` khác null.
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: Yêu cầu dừng đã ghi; theo dõi bằng `GET .../progress`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/PostOnly' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '409':
          description: |
            `session_not_stoppable` (phiên không ở active/paused/orphaned), `idempotency_conflict`
            (key đã dùng cho phiên khác), `stop_pending_or_unknown` (đã có yêu cầu dừng khác đang mở)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/PolicyUnconfigured' }

  /sessions/{sessionId}/statement:
    get:
      tags: [sessions]
      operationId: getChargingStatement
      x-status: implemented — BE-22
      summary: Bảng kê sau phiên (một lần trừ tiền, BR-P45)
      description: |
        Ánh xạ `DriverChargingService.statement`. Chỉ có sau khi quyết toán xong; trước đó 404
        `not_found` và app hiển thị theo `settlement_state` trong progress. Phiên đang `review`
        (đối soát mâu thuẫn, WF-03) chưa có bảng kê cho đến khi operator quyết.
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Bảng kê
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargingStatement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /credit:
    get:
      tags: [credit]
      operationId: getOwnCredit
      x-status: implemented — BE-22
      summary: Số dư Charging Credit của tài xế đang đăng nhập
      description: |
        Chỉ đọc (UC-PAY-02, màn hình 9). `balance_vnd` là snapshot `credit_accounts.balance_vnd`,
        luôn bằng tổng `amount_vnd` của sổ cái. `held_vnd` là tiền đang giữ trước cho start intent
        còn mở (BR-P18); `available_vnd = balance_vnd − held_vnd` là số CSMS dùng khi kiểm mức khởi
        đầu. Tài xế chưa có ví (đăng ký BE-21 không tạo ví) → 200 với số 0 và `status = none`;
        GET không tạo ví. Không có query.
      responses:
        '200':
          description: Số dư hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /credit/transactions:
    get:
      tags: [credit]
      operationId: listOwnCreditTransactions
      x-status: implemented — BE-22
      summary: Lịch sử sổ cái credit, mới nhất trước
      description: |
        Các dòng `credit_transactions` của ví tài xế, sắp `entry_no` giảm dần. Dòng `session_debit`
        có `session_id` → app mở `GET /sessions/{id}/statement` để xem bảng kê. Trang vượt cuối →
        `items` rỗng, `total` vẫn đúng.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Một trang sổ cái
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditTransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT có typ=JWT, sub=users.id dạng chuỗi, role=driver, iss, aud, iat và exp.
        Issuer/audience/key do server cấu hình; tuổi token và exp-iat tối đa 900 giây,
        không chấp nhận future iat, expired hoặc thuật toán khác. DB xác nhận role driver,
        account active và subtype drivers mỗi request. Không nhận identity trong query.
        Access token phát bởi `/auth/register`, `/auth/login`, `/auth/refresh` (BE-21); refresh
        token (`typ: refresh+jwt`) bị từ chối ở đây. OTP/Google/Firebase chưa triển khai.
        Local token script chỉ dành tài khoản synthetic.
        X-Driver-Id chỉ khi DRIVER_API_DEV_AUTH=true cùng NODE_ENV=development và
        DRIVER_API_ENV=local (hoặc test/test). Mặc định tắt; bearer sai không fallback.

  parameters:
    locationConsent:
      name: location_consent
      in: query
      required: true
      schema: { type: boolean, const: true }
      description: Explicit consent for this address/location request; not inferred from onboarding
    originLatitude:
      name: latitude
      in: query
      schema: { type: number, minimum: -90, maximum: 90 }
    originLongitude:
      name: longitude
      in: query
      schema: { type: number, minimum: -180, maximum: 180 }
    roadVinfastOverride:
      name: include_vinfast_only
      in: query
      schema: { type: boolean, default: false }
    vehicleId:
      name: vehicle_id
      in: query
      required: true
      description: Xe tài xế chọn (UC-ACC-03); quyết định chuẩn đầu cắm và bộ lọc VinFast
      schema: { $ref: '#/components/schemas/Id' }
    sessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Do app sinh (UUID v4 khuyến nghị), giữ nguyên khi gửi lại sau lỗi mạng
      schema: { $ref: '#/components/schemas/IdempotencyKey' }

  responses:
    RoadBadRequest:
      description: |
        Invalid, duplicate or unknown query; location_consent_required, origin_coordinates_required,
        invalid_input or invalid_search. Partial coordinates and invalid provider references are rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProviderBusy:
      description: provider_busy or provider_rate_limited; Retry-After 60 seconds
      headers:
        Retry-After:
          schema: { type: string, const: '60' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RoadUnavailable:
      description: |
        auth_unavailable, policy_unconfigured, station_location_unavailable, or provider_unavailable.
        Provider detail is one of unconfigured, credentials, restricted_or_quota, rate_limited,
        timeout, network, invalid_response, no_route. No raw provider body or URL is exposed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: |
        `invalid_input`, `invalid_search`, `invalid_connector_reference`, `invalid_idempotency_key`,
        `reserved_idempotency_key`, `unsupported_mode`, `vehicle_not_owned_or_incompatible`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Thiếu, sai hoặc hết hạn token (`unauthorized`), kèm WWW-Authenticate Bearer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`forbidden` — role/state/subtype không được phép; `forbidden_origin` — Origin ngoài local'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MethodNotAllowed:
      description: '`method_not_allowed`, Allow GET, OPTIONS'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PostOnly:
      description: '`method_not_allowed`, Allow POST, OPTIONS'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthBadRequest:
      description: |
        `consent_required` (thiếu `consent: true` hoặc `consent_version`, BR-P05), `invalid_email`,
        `invalid_password` (ngoài 8–128 ký tự), `invalid_input` (JSON hỏng, không phải object,
        trường lạ, tên/điện thoại sai, có query string)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountLocked:
      description: |
        `account_locked` — tài khoản không active (F-13); `forbidden` — refresh token của user không
        còn là driver; `forbidden_origin` — Origin ngoài local
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthMethodNotAllowed:
      description: '`method_not_allowed`, Allow POST, OPTIONS'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: '`payload_too_large` — body quá 16 KiB; server đóng kết nối'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: '`unsupported_media_type` — chỉ nhận Content-Type application/json (charset utf-8 tuỳ chọn)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyAttempts:
      description: '`too_many_attempts` — vượt giới hạn thử sai; Retry-After là số giây còn khoá'
      headers:
        Retry-After:
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthUnavailable:
      description: '`auth_unavailable` khi JWT chưa cấu hình; `policy_unconfigured` khi discovery policy chưa nạp'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: '`internal_error` — chi tiết nội bộ và secrets không trả cho client'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`not_found` — không có, hoặc không thuộc tài xế này (không phân biệt để tránh dò)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PolicyUnconfigured:
      description: '`policy_unconfigured` — CSMS chưa nạp chính sách sạc (biến môi trường CHARGE_*)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    AddressCandidate:
      type: object
      additionalProperties: false
      required: [ref_id, display, name, address]
      properties:
        ref_id: { type: string, maxLength: 4096 }
        display: { type: string, maxLength: 4096 }
        name: { type: string, maxLength: 4096 }
        address: { type: string, maxLength: 4096 }
    AddressSearchResult:
      type: object
      additionalProperties: false
      required: [value, computed_at, cached]
      properties:
        value:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AddressCandidate' }
        computed_at: { $ref: '#/components/schemas/Timestamp' }
        cached: { type: boolean }
    PlaceSearchResult:
      type: object
      additionalProperties: false
      required: [value, computed_at, cached]
      properties:
        value:
          type: object
          additionalProperties: false
          required: [ref_id, display, name, address, latitude, longitude]
          properties:
            ref_id: { type: string, maxLength: 4096 }
            display: { type: string, maxLength: 4096 }
            name: { type: string, maxLength: 4096 }
            address: { type: string, maxLength: 4096 }
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
        computed_at: { $ref: '#/components/schemas/Timestamp' }
        cached: { type: boolean }
    RoadGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          minItems: 2
          maxItems: 10000
          items:
            type: array
            minItems: 2
            maxItems: 2
            prefixItems:
              - { type: number, minimum: -180, maximum: 180 }
              - { type: number, minimum: -90, maximum: 90 }
            items: false
    StationRoadRoute:
      type: object
      additionalProperties: false
      required: [site_id, distance_m, duration_s, geometry, traffic_quality, computed_at, cached, quality]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        distance_m: { type: number, minimum: 0 }
        duration_s: { type: integer, minimum: 0 }
        geometry: { $ref: '#/components/schemas/RoadGeometry' }
        traffic_quality: { type: string, const: unknown }
        computed_at: { $ref: '#/components/schemas/Timestamp' }
        cached: { type: boolean }
        quality: { type: string, const: provider_estimate }
    Id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: bigint dạng chuỗi số, tối đa 9223372036854775807; giữ nguyên cả khi vượt MAX_SAFE_INTEGER
      examples: ['12']
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 100
      description: 'BE-22: tối đa 100 (giới hạn của service); sai → 400 `invalid_idempotency_key`'
      pattern: '^[A-Za-z0-9._:-]+$'
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-10-28T14:20:27.000Z']

    Error:
      type: object
      required: [error, detail]
      properties:
        error: { type: string, description: 'Mã ổn định, snake_case' }
        detail: { type: string, description: Lời giải thích để hiển thị }
      examples:
        - { error: credit_unavailable, detail: 'Số dư 15.000 ₫ thấp hơn mức khởi đầu 50.000 ₫' }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name, consent_version, consent]
      properties:
        email: { type: string, format: email, maxLength: 254, description: 'Trim + lowercase trước khi lưu' }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        full_name: { type: string, minLength: 1, maxLength: 100 }
        phone_number:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: E.164, tối đa 16 ký tự
        consent_version: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$', examples: ['tos-2026-11'] }
        consent: { type: boolean, const: true, description: 'BR-P05: đồng ý xử lý dữ liệu trước khi lưu' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128, writeOnly: true }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, maxLength: 8192 }
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: 'JWT HS256, typ JWT, role driver, sống 900 s' }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 900 }
    LoginTokens:
      allOf:
        - $ref: '#/components/schemas/AccessToken'
        - type: object
          required: [refresh_token, refresh_expires_in]
          properties:
            refresh_token: { type: string, description: 'JWT HS256, typ refresh+jwt; chỉ dùng cho /auth/refresh' }
            refresh_expires_in: { type: integer, description: 'Giây, theo DRIVER_API_REFRESH_TTL_S (mặc định 2592000)' }

    DriverBootstrap:
      type: object
      required: [user_id, full_name, role, account_status, vehicles]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        full_name: { type: string }
        role: { type: string, const: driver }
        account_status: { type: string, const: active }
        vehicles:
          type: array
          items: { $ref: '#/components/schemas/OwnVehicle' }

    OwnVehicle:
      type: object
      required: [vehicle_id, plate_number, is_default, vehicle_model_id, brand, model_name, connector_type, is_vinfast, battery_capacity_kwh, rated_range_km, max_dc_kw]
      properties:
        vehicle_id: { $ref: '#/components/schemas/Id' }
        plate_number: { type: string }
        is_default: { type: boolean }
        vehicle_model_id: { $ref: '#/components/schemas/Id' }
        brand: { type: string }
        model_name: { type: string }
        connector_type: { $ref: '#/components/schemas/ConnectorType' }
        is_vinfast: { type: boolean }
        battery_capacity_kwh: { type: [number, 'null'] }
        rated_range_km: { type: [integer, 'null'] }
        max_dc_kw: { type: [number, 'null'] }

    DriverConnectorStatus:
      type: string
      description: |
        Trạng thái hướng tài xế (BR-P38): `available` = Available; `in_use` = Preparing, Charging,
        SuspendedEV, SuspendedEVSE; `freeing_soon` = Finishing; `unavailable` = Reserved,
        Unavailable, Faulted; `offline` = không có bản tin quá ngưỡng offline; `unknown` = chưa
        từng có StatusNotification. Súng có sự cố mở (trừ `driver_report`) không được trả về, nên
        `unavailable` / `offline` chỉ còn gặp khi sự cố chưa được ghi (vd. trước ngưỡng 900 s).
      enum: [available, in_use, freeing_soon, unavailable, offline, unknown]
    StatusQuality:
      type: string
      description: BR-P39 — `stale` khi không có bản tin quá 2 chu kỳ heartbeat; app hiện "có thể đã cũ"
      enum: [fresh, stale, unknown]
    OcppConnectorStatus:
      type: string
      enum: [Available, Preparing, Charging, SuspendedEVSE, SuspendedEV, Finishing, Reserved, Unavailable, Faulted]
    ConnectorType:
      type: string
      enum: [ccs2, chademo, gbt, type2]

    Connector:
      type: object
      required: [connector_id, connector_no, charge_point_id, connector_type, driver_status, status_quality, is_online, available_now]
      properties:
        connector_id: { $ref: '#/components/schemas/Id' }
        connector_no: { type: integer, enum: [1, 2], description: '1 = súng A, 2 = súng B (BR-P10)' }
        charge_point_id: { $ref: '#/components/schemas/Id' }
        display_code: { type: [string, 'null'], description: 'Mã in trên trụ, dùng trong QR' }
        connector_type: { $ref: '#/components/schemas/ConnectorType' }
        max_power_kw: { type: [number, 'null'] }
        rated_power_kw: { type: [number, 'null'], description: Công suất trụ dùng khi công suất súng null }
        status: { $ref: '#/components/schemas/OcppConnectorStatus' }
        driver_status: { $ref: '#/components/schemas/DriverConnectorStatus' }
        status_quality: { $ref: '#/components/schemas/StatusQuality' }
        status_updated_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        last_message_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        is_online: { type: boolean }
        online_changed_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        lifecycle:
          type: string
          enum: [registered, awaiting_connection, in_service, disabled, decommissioned]
        available_now:
          type: boolean
          description: '`driver_status = available`, fresh, online, in_service và không có bằng chứng đang bị chiếm; không bảo đảm lệnh Start sẽ thành công'
        time_left:
          description: Có khi `driver_status` là `in_use` hoặc `freeing_soon`; Tuần 9
          oneOf: [{ $ref: '#/components/schemas/TimeLeftEstimate' }, { type: 'null' }]

    Station:
      type: object
      required: [site_id, site_code, site_name, operator_id, operator_name, vinfast_only, connectors]
      properties:
        site_id: { $ref: '#/components/schemas/Id' }
        site_code: { type: string }
        site_name: { type: string }
        address: { type: [string, 'null'] }
        operator_id: { $ref: '#/components/schemas/Id' }
        operator_name: { type: string, description: Nhà vận hành sở hữu trạm (BR-P11) }
        vinfast_only: { type: boolean }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        distance_m: { type: [integer, 'null'], description: 'Đường chim bay làm tròn mét, chỉ khi có toạ độ' }
        reach: { type: [string, 'null'], enum: [ok, tight, risky, null] }
        best_connector_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        est_drive_min: { type: [number, 'null'], minimum: 0 }
        est_wait_min: { type: [number, 'null'], minimum: 0 }
        est_charge_min: { type: [number, 'null'], minimum: 0 }
        est_total_min: { type: [number, 'null'], minimum: 0 }
        est_energy_kwh: { type: [number, 'null'], minimum: 0 }
        est_cost_vnd_max:
          type: [integer, 'null']
          minimum: 0
          maximum: 9007199254740991
          description: Ceil(kWh × giá cao nhất hiện hành của operator); null nếu thiếu/không an toàn số. Không là quyết toán.
        connectors:
          type: array
          items: { $ref: '#/components/schemas/Connector' }

    SmartSearchAssumptions:
      type: object
      additionalProperties: false
      required: [range_factor, road_factor, reserve_km, avg_speed_kmh, charge_efficiency, available_wait_min, freeing_soon_wait_min, in_use_wait_min, radius_factor, fallback_limit]
      properties:
        range_factor: { type: number, minimum: 0.001, maximum: 1, default: 0.75 }
        road_factor: { type: number, minimum: 1, maximum: 10, default: 1.3 }
        reserve_km: { type: number, minimum: 0, maximum: 20040, default: 10 }
        avg_speed_kmh: { type: number, minimum: 0.1, maximum: 300, default: 30 }
        charge_efficiency: { type: number, minimum: 0.001, maximum: 1, default: 0.85 }
        available_wait_min: { type: number, minimum: 0, maximum: 10080, default: 0 }
        freeing_soon_wait_min: { type: number, minimum: 0, maximum: 10080, default: 5 }
        in_use_wait_min: { type: number, minimum: 0, maximum: 10080, default: 30 }
        radius_factor: { type: number, minimum: 0.1, maximum: 10, default: 1.5 }
        fallback_limit: { type: integer, minimum: 1, maximum: 100, default: 3 }
    SmartSearchEstimate:
      type: object
      additionalProperties: false
      required: [soc_percent, est_range_km, assumptions]
      properties:
        soc_percent: { type: number, minimum: 0, exclusiveMaximum: 80 }
        est_range_km: { type: number, minimum: 0 }
        assumptions: { $ref: '#/components/schemas/SmartSearchAssumptions' }
    StationSearchResult:
      type: object
      required: [items, total, page, page_size, estimate]
      properties:
        estimate: { oneOf: [{ $ref: '#/components/schemas/SmartSearchEstimate' }, { type: 'null' }] }
        smart_unavailable_reason: { type: string, enum: [no_soc, no_location, missing_vehicle_specs] }
        items:
          type: array
          items: { $ref: '#/components/schemas/Station' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }

    ResolvedConnector:
      type: object
      required: [connector_id, connector_no, status, serial_number, lifecycle, is_online, site_name, vinfast_only]
      properties:
        connector_id: { $ref: '#/components/schemas/Id' }
        connector_no: { type: integer, enum: [1, 2] }
        status: { $ref: '#/components/schemas/OcppConnectorStatus' }
        display_code: { type: [string, 'null'] }
        serial_number: { type: string }
        lifecycle: { type: string }
        is_online: { type: boolean }
        online_changed_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        last_message_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        site_name: { type: string }
        vinfast_only: { type: boolean }

    TimeLeftEstimate:
      type: object
      description: |
        BR-P32: luôn là khoảng hoặc `unknown`, không bao giờ là một mốc. BR-P40: `kind` cho biết
        ước tính dựa vào gì, app hiển thị kèm.
      required: [kind, computed_at]
      properties:
        kind:
          type: string
          enum: [limit, soc_curve, history, unknown]
        min_minutes: { type: [integer, 'null'], minimum: 0 }
        max_minutes: { type: [integer, 'null'], minimum: 0 }
        computed_at: { $ref: '#/components/schemas/Timestamp' }
        reason:
          type: [string, 'null']
          description: Khi `unknown` — `not_in_use`, `no_soc`, `no_history`, `charge_point_offline`
        basis:
          type: [string, 'null']
          description: Dữ liệu dùng để tính, ví dụ "SoC 42 % → 80 %, đường cong 60 kW"
      examples:
        - { kind: soc_curve, min_minutes: 18, max_minutes: 26, computed_at: '2026-10-28T14:20:27Z', reason: null, basis: 'SoC 42 % → 80 %, 60 kW' }
        - { kind: unknown, min_minutes: null, max_minutes: null, computed_at: '2026-10-28T14:20:27Z', reason: no_soc, basis: null }

    StartChargeRequest:
      type: object
      required: [connector_id, vehicle_id, mode, energy_limit_wh]
      properties:
        connector_id: { $ref: '#/components/schemas/Id' }
        vehicle_id: { $ref: '#/components/schemas/Id' }
        mode: { type: string, enum: [energy_kwh], description: Chỉ hạn mức kWh ở Iteration 2 }
        energy_limit_wh:
          type: integer
          minimum: 1
          description: Hạn mức tài xế chọn; CSMS cắt thấp hơn nếu tín dụng không đủ (BR-P18)

    ChargeSnapshot:
      type: object
      description: Trạng thái của một start intent (D4). Trả cùng hình dạng ở POST /charges và GET /charges/{key}.
      required: [intent_id, command_id, session_id, outcome, effect_confirmed, version, max_energy_wh]
      properties:
        intent_id: { $ref: '#/components/schemas/Id' }
        command_id:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: RemoteStartTransaction đã ghi vào `remote_commands`; null khi bị từ chối trước khi gửi
        session_id:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: Có khi trụ đã gửi StartTransaction khớp intent
        outcome:
          type: string
          description: |
            BE-22 (khớp code): lý do từ chối nếu có, nếu không thì trạng thái phiên khi đã có phiên,
            nếu không thì trạng thái intent.
            - Lý do từ chối: `topuprequired` (số dư khả dụng dưới mức khởi đầu, BR-P18),
              `requiresconfirmation` (xem `max_energy_wh`), `start_timeout` (trụ không bắt đầu
              trong hạn, intent đã giải phóng).
            - Trạng thái phiên: `active`, `paused`, `stopping`, `closed`, `reconciled`, `review`,
              `orphaned`.
            - Trạng thái intent: `sent` (đang chờ trụ), `accepted` (trụ nhận lệnh, chờ
              StartTransaction), `unknown` (trụ không trả lời — tiếp tục poll), `rejected` (trụ từ
              chối), `released`.
        effect_confirmed:
          type: boolean
          description: true khi `session_id` khác null, tức trụ đã gửi StartTransaction khớp intent
        version: { type: integer, minimum: 1 }
        max_energy_wh:
          type: [integer, 'null']
          description: Hạn mức sau khi cắt theo tín dụng; khác `energy_limit_wh` gửi lên là đã bị cắt

    StopSnapshot:
      type: object
      description: Hình dạng của `DriverChargingService.commandSnapshot` — lệnh dừng mới nhất của phiên
      required: [command_id, command_status, session_status, effect_confirmed]
      properties:
        command_id: { $ref: '#/components/schemas/Id' }
        command_status:
          type: string
          enum: [pending, sent, accepted, rejected, timeout, failed]
          description: '`remote_commands.status`; `timeout` → app poll progress, operator có thể khôi phục (T72)'
        session_status:
          type: string
          enum: [pending, active, paused, stopping, closed, review, reconciled, orphaned, failed]
        effect_confirmed:
          type: boolean
          description: true khi phiên đã có `meter_stop_wh`, tức trụ đã gửi StopTransaction

    SessionProgress:
      type: object
      required: [session_id, status, updated_at, meter_start_wh, consumed_wh, telemetry_quality, charge_point]
      properties:
        session_id: { $ref: '#/components/schemas/Id' }
        status:
          type: string
          enum: [pending, active, paused, stopping, closed, review, reconciled, orphaned, failed]
          description: STM-1. `orphaned` = trụ mất liên lạc quá ân hạn (WF-03), app hiện "đang chờ trụ báo cáo"
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        meter_start_wh: { type: integer }
        meter_stop_wh: { type: [integer, 'null'] }
        energy_wh: { type: [integer, 'null'], description: Điện năng chốt sau StopTransaction }
        consumed_wh:
          type: [integer, 'null']
          description: Điện năng đã sạc tới hiện tại (mẫu mới nhất − meter_start) hoặc `energy_wh` khi đã dừng
        telemetry_quality:
          type: string
          enum: [observed, unknown]
        limit_value: { type: [integer, 'null'], description: Hạn mức Wh đã áp (BR-P18) }
        reserved_vnd: { type: [integer, 'null'], description: Số tiền đang giữ trước cho phiên }
        estimated_cost_vnd:
          type: [integer, 'null']
          description: |
            BE-22 (§11 #2): cận trên ceil(`consumed_wh` × giá cao nhất hiện hành của operator / 1000)
            — cùng giá dùng để giữ trước. Null khi chưa có `consumed_wh` hoặc chưa có biểu giá.
            Không phải số trừ thật; số trừ thật ở statement (BR-P45).
        billing_review_required: { type: boolean }
        settlement_state:
          type: [string, 'null']
          description: Trạng thái job quyết toán (`charge_settlement_jobs.state`); null khi chưa dừng
        settlement_reason: { type: [string, 'null'] }
        settlement_retry_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        time_left:
          description: BE-22 luôn null (hàm ước tính chưa có)
          oneOf: [{ $ref: '#/components/schemas/TimeLeftEstimate' }, { type: 'null' }]
        charge_point:
          type: object
          required: [lifecycle, is_online]
          properties:
            lifecycle: { type: string }
            is_online: { type: boolean }
            online_changed_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
            last_message_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }

    ChargingStatement:
      type: object
      description: Một dòng `charging_statements`; một phiên một bảng kê, một lần trừ (BR-P45)
      required: [session_id, driver_id, energy_wh, amount_vnd, earned_points, debit_id, loyalty_entry_id, created_at]
      properties:
        session_id: { $ref: '#/components/schemas/Id' }
        driver_id: { $ref: '#/components/schemas/Id' }
        energy_wh: { type: integer, minimum: 0 }
        amount_vnd: { type: integer, minimum: 0, description: 'Đã làm tròn một lần, nửa lên' }
        earned_points: { type: integer, minimum: 0, description: 'BR-P34, 1 điểm / 1.000 ₫' }
        debit_id: { $ref: '#/components/schemas/Id' }
        loyalty_entry_id: { $ref: '#/components/schemas/Id' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    CreditSummary:
      type: object
      additionalProperties: false
      required: [balance_vnd, held_vnd, available_vnd, status, updated_at]
      properties:
        balance_vnd: { type: integer, description: 'Có thể âm khi ví in_shortfall' }
        held_vnd: { type: integer, minimum: 0, description: Đang giữ trước cho start intent còn mở }
        available_vnd: { type: integer, description: balance_vnd − held_vnd }
        status:
          type: string
          enum: [active, in_shortfall, closed, none]
          description: '`none` = chưa có ví'
        updated_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
      examples:
        - { balance_vnd: 200000, held_vnd: 50000, available_vnd: 150000, status: active, updated_at: '2026-11-10T13:20:00.000Z' }

    CreditTransaction:
      type: object
      additionalProperties: false
      required: [transaction_id, entry_no, transaction_type, amount_vnd, balance_after_vnd, session_id, top_up_id, reservation_id, created_at]
      properties:
        transaction_id: { $ref: '#/components/schemas/Id' }
        entry_no: { type: integer, minimum: 1 }
        transaction_type:
          type: string
          enum: [top_up, session_debit, refund, adjustment, reservation_fee]
        amount_vnd: { type: integer, description: 'Dương = cộng ví, âm = trừ ví' }
        balance_after_vnd: { type: integer }
        session_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        top_up_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        reservation_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    CreditTransactionPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CreditTransaction' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
