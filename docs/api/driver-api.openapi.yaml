  /charges:
    post:
      tags: [charges]
      operationId: startCharge
      x-status: implemented — BE-22
      summary: Yêu cầu bắt đầu phiên từ app
      description: |
        Ánh xạ `DriverChargingService.start(driverId, key, input)`. Tạo **start intent** bền
        trước khi gửi RemoteStartTransaction (quyết định D4). Gọi lại cùng `Idempotency-Key` và
        cùng body trả về cùng snapshot; cùng key khác body → 409 `idempotency_conflict`.
        Kiểm tra tín dụng theo BR-P18 (đủ mức khởi đầu) và giữ trước `reserved_vnd`; CSMS tự dừng
        khi chạm mức dự trữ cắt (BR-P19). Chỉ có chế độ `energy_kwh` (hạn mức kWh); các chế độ
        khác là hướng phát triển (README WP3).

        BE-22: body `application/json` ≤ 16 KiB, trường lạ → 400 `invalid_input`; `connector_id`,
        `vehicle_id` là **chuỗi** số. Request trả về khi lệnh RemoteStart đã có kết quả (tối đa
        `CHARGE_COMMAND_TIMEOUT_MS`, mặc định 30 s). **Tín dụng không đủ không phải lỗi HTTP**: intent
        được ghi ở trạng thái từ chối và trả 202 với `outcome = topuprequired` (dưới mức khởi đầu)
        hoặc `requiresconfirmation` (đủ mức khởi đầu nhưng không đủ cho hạn mức xin; `max_energy_wh`
        là hạn mức tối đa CSMS đề nghị — app hỏi tài xế rồi gửi **key mới** với
        `energy_limit_wh = max_energy_wh`). Gửi lại cùng key trả lại đúng kết quả đó.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartChargeRequest' }
      responses:
        '202':
          description: Intent đã ghi; lệnh có thể đang gửi hoặc đã có kết quả — xem `outcome`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargeSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/PostOnly' }
        '409':
          description: |
            `idempotency_conflict` (cùng key khác body); `credit_unavailable` (tài xế **chưa có ví**
            hoặc ví không `active` — số dư thấp đi qua 202 `topuprequired`); `connector_unavailable`
            (không có súng đó, trụ offline / không `in_service`, operator ngừng, hoặc súng không ở
            Available/Preparing — kể cả đang Charging); `connector_busy_or_unknown` (BR-P12: còn
            intent/phiên mở trên súng, hoặc chưa có Available sau phiên trước); `tariff_unavailable`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/PolicyUnconfigured' }

