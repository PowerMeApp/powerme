  /operator/v1/revenue:
    get:
      tags: [revenue]
      operationId: getOperatorRevenue
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Khang (T108)
      x-refs: [UC-OPS-09, FR-18, BR-P46, BR-P45, BR-P08, 'Table 5 #25']
      summary: Doanh thu của operator theo trụ, site hoặc ngày (BR-P46)
      description: |
        `revenue_vnd` = tổng `session_debit` của phiên `payment_mode = csms_billed` và
        `status = reconciled`, mỗi phiên tính đúng một lần (unique index
        `credit_transactions_one_debit_per_session`), chỉ trụ của operator người gọi. Phiên
        `unattributed` là dòng riêng, chỉ đếm phiên và Wh, không có tiền. Không tính phí nền tảng,
        không chia doanh thu (K1 đóng). Xếp kỳ (K3, Trí chốt 12/11): phiên `reconciled` xếp theo
        **đúng mốc giờ quyết toán đã dùng để tính giá** (giờ trụ đã kiểm, hoặc giờ CSMS khi rơi về
        — cách lưu mốc chờ #120 / T101); khi chưa có mốc lưu thì dùng
        `COALESCE(cp_stopped_at, received_stopped_at)`. Phiên `closed` / `review` xếp theo
        `received_stopped_at`. Ngày chia theo UTC+7 (Asia/Ho_Chi_Minh). Phiên csms_billed đã dừng
        nhưng chưa reconciled được đếm ở `pending_reconciliation`; số của kỳ cũ có thể đổi khi
        một phiên đối soát muộn, nên màn hình và CSV ghi "tính đến lúc `generated_at`".
      parameters:
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/revenueGroupBy'
        - name: site_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
