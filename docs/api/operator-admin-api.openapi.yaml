        '200':
          description: Báo cáo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevenueReport' }
        '400': { $ref: '#/components/responses/RevenueBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

