  /operator/v1/charge-points/{chargePointId}/commands:
    post:
      tags: [monitoring]
      operationId: sendRemoteCommand
      x-roles: [operator_staff]
      x-status: console
      x-source: 'POST /api/admin/sessions/{id}/remote-stop → ConsoleCommands.remoteStop (chỉ remote_stop, đồng bộ 200)'
      x-owner: Trí
      x-refs: [UC-OPS-04, FR-11, BR-P01, BR-P06, BR-P07, 'Table 7 #2']
      summary: Gửi lệnh từ xa — remote_start, remote_stop, reset
      description: |
        Trả **202** ngay với lệnh `pending`/`sent`; kết quả thật đọc ở `GET /commands/{id}` (hoặc
        sự kiện realtime `command.result` khi có). Lệnh ghi vào `remote_commands` với
        `requested_by` = người gọi và `idempotency_key`.
        - `remote_stop`: cần `session_id` của phiên trên trụ này ở `pending|active|paused|stopping`.
          Phiên chỉ `closed` khi trụ gửi StopTransaction (BR-P01).
        - `remote_start`: cần `connector_no` và `id_tag`; trụ sẽ Authorize như mọi phiên, nên idTag
          phải được chấp nhận (BR-P06) và phiên được phân loại bình thường (BR-P08).
        - `reset`: `type` Soft|Hard, cả trụ (OCPP 1.6). Còn phiên đang sạc → 409 `sessions_active`
          trừ khi `force = true` (cùng luật với Reset trong WF-04, BR-P07).
        Trụ offline → 409 `station_offline`, không ghi lệnh. `UnlockConnector` không có trong
        SRS Table 7 #2 nên chưa nằm trong hợp đồng (câu hỏi mở).
      parameters:
        - $ref: '#/components/parameters/chargePointId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '202':
          description: Lệnh đã nhận; kết quả về sau
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteCommand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `station_offline`, `session_not_stoppable`, `connector_busy_or_unknown`,
            `sessions_active`, `reset_in_progress`, `idempotency_conflict`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

