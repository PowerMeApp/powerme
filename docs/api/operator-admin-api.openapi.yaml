components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Đề xuất (chưa code): cùng khoá HS256, issuer và audience với Driver API (ADR-0017), `typ:
        JWT`, `sub` = users.id chuỗi, `role` ∈ {`operator_staff`, `admin`} (giá trị enum
        `user_role` trong DB), iat/exp, tối đa 900 s. Mỗi request kiểm DB: role khớp, account
        `active`, có dòng `operator_staff` (operator `active`) hoặc `admins`. Phạm vi operator lấy
        từ DB (`operator_staff.operator_id`), không từ token hay query. Token hợp lệ nhưng role
        không được phép (kể cả token tài xế) → 403 `forbidden` (F-13). Token thiếu/sai/hết hạn →
        401. Không có header dev kiểu `X-Driver-Id` cho bề mặt này.

  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    after:
      name: after
      in: query
      description: Con trỏ — chỉ lấy dòng có id lớn hơn
      schema: { $ref: '#/components/schemas/Id' }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    from:
      name: from
      in: query
      description: Thời điểm bắt đầu (bao gồm), so với `started_at`
      schema: { $ref: '#/components/schemas/Timestamp' }
    to:
      name: to
      in: query
      description: Thời điểm kết thúc (không bao gồm)
      schema: { $ref: '#/components/schemas/Timestamp' }
    fromDate:
      name: from
      in: query
      required: true
      description: Ngày đầu kỳ (bao gồm), Asia/Ho_Chi_Minh
      schema: { type: string, format: date }
    toDate:
      name: to
      in: query
      required: true
      description: Ngày cuối kỳ (bao gồm), Asia/Ho_Chi_Minh; kỳ tối đa 366 ngày
      schema: { type: string, format: date }
    revenueGroupBy:
      name: group_by
      in: query
      schema: { type: string, enum: [charge_point, site, day], default: charge_point }
    chargePointId:
      name: chargePointId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    faultId:
      name: faultId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    sessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    intentId:
      name: intentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    promotionId:
      name: promotionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    userId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    topUpId:
      name: topUpId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Do dashboard sinh (UUID v4 khuyến nghị), giữ nguyên khi gửi lại sau lỗi mạng. Cùng key +
        cùng body trong 24 giờ → trả lại đúng response cũ, không gửi lệnh lần hai. Cùng key khác
        body → 409 `idempotency_conflict`.
      schema: { $ref: '#/components/schemas/IdempotencyKey' }

  responses:
    BadRequest:
      description: '`invalid_input` — tham số/body sai, trường lạ, id không phải bigint dương'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`unauthorized` — thiếu, sai hoặc hết hạn token; kèm WWW-Authenticate Bearer'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        `forbidden` — role không được phép ở endpoint này (F-13); `account_locked` — tài khoản bị
        khoá sau khi token được cấp; `forbidden_origin` — Origin không nằm trong danh sách cho phép
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`not_found` — không có, hoặc thuộc operator khác (không phân biệt để tránh dò)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidTransition:
      description: '`invalid_transition` — trạng thái hiện tại không cho phép hành động này'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StationError:
      description: '`station_error` — trụ trả lỗi, status lạ hoặc quá hạn'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: '`faults_unavailable` / `auth_unavailable` — module chưa nạp hoặc chưa cấu hình'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: '`invalid_credentials` — sai email, sai mật khẩu hoặc không phải role của bề mặt này'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRefreshToken:
      description: '`invalid_refresh_token`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountLocked:
      description: '`account_locked` (F-13), `operator_inactive` (operator bị đình chỉ / đóng)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyAttempts:
      description: '`too_many_attempts`; Retry-After là số giây còn khoá'
      headers:
        Retry-After:
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthUnavailable:
      description: '`auth_unavailable` — JWT chưa cấu hình'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RecoveryBadRequest:
      description: '`invalid_input`, `recovery_evidence_required`, `invalid_recovery_retry`, `invalid_boundary_evidence`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RecoveryConflict:
      description: |
        `recovery_waiting_for_connection`, `start_not_recoverable`, `start_effect_observed`,
        `recovery_evidence_incomplete`, `recovery_not_completed`, `stop_attempt_not_current`,
        `stop_effect_observed_or_not_recoverable`, `session_not_stoppable` (mã của
        `ChargingError`, giữ nguyên văn)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RevenueBadRequest:
      description: '`invalid_input`, `invalid_period` (from > to hoặc dài hơn 366 ngày)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---- chung ----------------------------------------------------------------------------------
    Id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: bigint dạng chuỗi số (như Driver API)
      examples: ['12']
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 64
      pattern: '^[A-Za-z0-9._:-]+$'
      description: Tối đa 64 vì cột `remote_commands.idempotency_key` là varchar(64)
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-11-10T08:30:00.000Z']
    Error:
      type: object
      required: [error, detail]
      properties:
        error: { type: string, description: 'Mã ổn định, snake_case' }
        detail: { type: string, description: 'Lời giải thích để hiển thị' }
      examples:
        - { error: sessions_active, detail: 'Trụ PM-D1-HCM-0001 đang có phiên sạc ở súng 2 (phiên 418); Reset sẽ cắt phiên này.' }
    PageMeta:
      type: object
      required: [total, page, page_size]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    NoteRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 500, description: 'Lý do / bằng chứng, ghi vào lịch sử' }
    OperatorRef:
      type: object
      required: [id, legal_name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        legal_name: { type: string }
    SiteRef:
      type: object
      required: [id, site_code, site_name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        site_code: { type: string }
        site_name: { type: string }

    # ---- auth -----------------------------------------------------------------------------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 1, maxLength: 4096 }
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 900 }
    LoginTokens:
      allOf:
        - $ref: '#/components/schemas/AccessToken'
        - type: object
          required: [refresh_token, refresh_expires_in]
          properties:
            refresh_token: { type: string }
            refresh_expires_in: { type: integer, minimum: 3600 }
    StaffProfile:
      type: object
      required: [user_id, email, full_name, role, operator, staff_role]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [operator_staff, admin] }
        operator:
          oneOf:
            - $ref: '#/components/schemas/OperatorRef'
            - type: 'null'
        staff_role: { type: [string, 'null'], enum: [manager, technician, null] }

    # ---- trụ / súng -----------------------------------------------------------------------------
    ChargePointLifecycle:
      type: string
      enum: [registered, awaiting_connection, in_service, disabled, decommissioned]
      description: STM-3 v0.3; giá trị DB cũ `offline` được trả là `in_service`
    ConnectorStatus:
      type: string
      enum: [Available, Preparing, Charging, SuspendedEV, SuspendedEVSE, Finishing, Reserved, Unavailable, Faulted]
    Site:
      type: object
      required: [id, site_code, site_name, vinfast_only]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        site_code: { type: string, maxLength: 20 }
        site_name: { type: string }
        address: { type: [string, 'null'] }
        vinfast_only: { type: boolean }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    SitePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Site' } }
    ConnectorLive:
      type: object
      required: [connector_id, connector_no, status, status_updated_at, status_quality]
      properties:
        connector_id: { $ref: '#/components/schemas/Id' }
        connector_no: { type: integer, enum: [1, 2], description: 'BR-P10: 1 = súng A, 2 = súng B' }
        connector_type: { type: [string, 'null'], enum: [ccs2, chademo, gbt, type2, null] }
        max_power_kw: { type: [number, 'null'] }
        status: { $ref: '#/components/schemas/ConnectorStatus' }
        status_updated_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        status_quality:
          type: string
          enum: [fresh, stale, offline]
          description: BR-P39 — stale sau 2 chu kỳ heartbeat; offline sau ngưỡng 900 s
        error_code: { type: [string, 'null'], description: 'ChargePointErrorCode gần nhất khi Faulted' }
        active_session_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
    ChargePoint:
      type: object
      required: [id, serial_number, display_code, lifecycle, connected, is_online, last_message_at, site, connectors]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        serial_number: { type: string, description: 'OCPP identity, cuối URL /ocpp/{serial}' }
        display_code: { type: [string, 'null'], examples: ['PM-D1-HCM-0001'] }
        model: { type: [string, 'null'] }
        lifecycle: { $ref: '#/components/schemas/ChargePointLifecycle' }
        connected: { type: boolean, description: 'Socket đang mở trong tiến trình này' }
        is_online: { type: boolean, description: 'Cột DB (ADR-0016 D-C)' }
        last_message_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        site:
          oneOf:
            - $ref: '#/components/schemas/SiteRef'
            - type: 'null'
        connectors: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/ConnectorLive' } }
    ChargePointPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ChargePoint' } }
    ChargePointDetail:
      allOf:
        - $ref: '#/components/schemas/ChargePoint'
        - type: object
          required: [open_faults, recent_commands]
          properties:
            firmware_version: { type: [string, 'null'] }
            rated_power_kw: { type: [number, 'null'] }
            reports_soc: { type: boolean, description: 'BR-P40 — trụ có gửi SoC' }
            supports_reservation: { type: boolean }
            open_faults: { type: array, items: { $ref: '#/components/schemas/Fault' } }
            recent_commands:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/RemoteCommand' }
    MetricValues:
      type: object
      required: [uptime_ratio, utilisation_ratio, fault_count, failed_start_rate]
      properties:
        uptime_ratio: { type: [number, 'null'], minimum: 0, maximum: 1 }
        utilisation_ratio: { type: [number, 'null'], minimum: 0, maximum: 1 }
        fault_count: { type: integer, minimum: 0 }
        failed_start_rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
    ChargePointMetrics:
      allOf:
        - $ref: '#/components/schemas/MetricValues'
        - type: object
          required: [charge_point_id, window, from, to, connectors]
          properties:
            charge_point_id: { $ref: '#/components/schemas/Id' }
            window: { type: string, enum: [7d, 30d] }
            from: { $ref: '#/components/schemas/Timestamp' }
            to: { $ref: '#/components/schemas/Timestamp' }
            connectors:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/MetricValues'
                  - type: object
                    required: [connector_no]
                    properties:
                      connector_no: { type: integer, enum: [1, 2] }
    ConnectorInput:
      type: object
      additionalProperties: false
      required: [connector_no]
      properties:
        connector_no: { type: integer, enum: [1, 2] }
        connector_type: { type: string, enum: [ccs2, chademo, gbt, type2] }
        max_power_kw: { type: [number, 'null'], exclusiveMinimum: 0 }
    OnboardRequest:
      type: object
      additionalProperties: false
      required: [serial_number, site_id, connectors]
      properties:
        serial_number: { type: string, pattern: '^[A-Za-z0-9._-]{3,48}$' }
        site_id: { $ref: '#/components/schemas/Id' }
        connectors:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/ConnectorInput' }
    OnboardResult:
      type: object
      required: [charge_point_id, display_code, lifecycle, ocpp_url, identity, password]
      properties:
        charge_point_id: { $ref: '#/components/schemas/Id' }
        display_code: { type: string }
        lifecycle: { type: string, const: awaiting_connection }
        ocpp_url: { type: string, description: '`{OCPP base URL}/{serial_number}`' }
        identity: { type: string, description: 'Tên Basic Auth = serial' }
        password: { type: string, minLength: 24, maxLength: 24, description: 'Hiện một lần; chỉ băm được lưu' }
    LifecycleResult:
      type: object
      required: [charge_point_id, lifecycle]
      properties:
        charge_point_id: { $ref: '#/components/schemas/Id' }
        lifecycle: { $ref: '#/components/schemas/ChargePointLifecycle' }
    RegistryChargePoint:
      type: object
      required: [id, serial_number, lifecycle, is_online, free_vend_tag, operator, site, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        serial_number: { type: string }
        display_code: { type: [string, 'null'] }
        model: { type: [string, 'null'], maxLength: 20 }
        firmware_version: { type: [string, 'null'], maxLength: 50 }
        rated_power_kw: { type: [number, 'null'] }
        warranty_until: { type: [string, 'null'], format: date }
        lifecycle: { $ref: '#/components/schemas/ChargePointLifecycle' }
        is_online: { type: boolean }
        free_vend_tag: { type: [string, 'null'], maxLength: 20 }
        operator:
          oneOf:
            - $ref: '#/components/schemas/OperatorRef'
            - type: 'null'
        site:
          oneOf:
            - $ref: '#/components/schemas/SiteRef'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
    RegistryChargePointPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/RegistryChargePoint' } }
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [serial_number]
      properties:
        serial_number: { type: string, pattern: '^[A-Za-z0-9._-]{3,48}$' }
        model: { type: [string, 'null'], maxLength: 20 }
        rated_power_kw: { type: [number, 'null'], exclusiveMinimum: 0 }
    RegistryChargePointPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        model: { type: [string, 'null'], maxLength: 20 }
        firmware_version: { type: [string, 'null'], maxLength: 50 }
        rated_power_kw: { type: [number, 'null'], exclusiveMinimum: 0 }
        warranty_until: { type: [string, 'null'], format: date }
    FreeVendTagRequest:
      type: object
      additionalProperties: false
      required: [free_vend_tag]
      properties:
        free_vend_tag: { type: [string, 'null'], minLength: 1, maxLength: 20 }

    # ---- lệnh / tóm tắt / bản tin -------------------------------------------------------------
    CommandRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [remote_start, remote_stop, reset] }
        connector_no: { type: integer, enum: [1, 2], description: 'Bắt buộc với remote_start' }
        id_tag: { type: string, minLength: 1, maxLength: 20, description: 'Bắt buộc với remote_start' }
        session_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: Bắt buộc với remote_stop
        type: { type: string, enum: [Soft, Hard], default: Soft, description: 'Chỉ với reset' }
        force: { type: boolean, default: false, description: 'Chỉ với reset — xác nhận lần hai khi còn phiên' }
    RemoteCommandStatus:
      type: string
      enum: [pending, sent, accepted, rejected, timeout, failed]
    RemoteCommand:
      type: object
      required: [id, charge_point_id, action, connector_no, status, requested_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        charge_point_id: { $ref: '#/components/schemas/Id' }
        action:
          type: string
          description: Tên action OCPP nguyên văn (RemoteStartTransaction, RemoteStopTransaction, Reset, ChangeAvailability)
        connector_no: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/RemoteCommandStatus' }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        sent_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        responded_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        error: { type: [string, 'null'] }
    OperatorSummary:
      type: object
      required: [charge_points, connectors, open_faults, sessions_to_review, unattributed_sessions, uncertain_starts]
      properties:
        charge_points:
          type: object
          required: [total, online, offline, by_lifecycle]
          properties:
            total: { type: integer, minimum: 0 }
            online: { type: integer, minimum: 0 }
            offline: { type: integer, minimum: 0 }
            by_lifecycle:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
        connectors:
          type: object
          description: Đếm theo nhóm BR-P38 (cùng cách gộp với app tài xế)
          required: [available, in_use, freeing_soon, unavailable, offline]
          properties:
            available: { type: integer, minimum: 0 }
            in_use: { type: integer, minimum: 0 }
            freeing_soon: { type: integer, minimum: 0 }
            unavailable: { type: integer, minimum: 0 }
            offline: { type: integer, minimum: 0 }
        open_faults:
          type: object
          required: [total, critical, major, minor, none]
          properties:
            total: { type: integer, minimum: 0 }
            critical: { type: integer, minimum: 0 }
            major: { type: integer, minimum: 0 }
            minor: { type: integer, minimum: 0 }
            none: { type: integer, minimum: 0 }
        sessions_to_review: { type: integer, minimum: 0 }
        unattributed_sessions: { type: integer, minimum: 0 }
        uncertain_starts: { type: integer, minimum: 0, description: 'Hàng việc T72' }
    OcppMessage:
      type: object
      required: [id, charge_point_serial, received_at, epoch, direction, unique_id, replayed]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        charge_point_serial: { type: string }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        cp_timestamp: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        epoch: { type: integer, minimum: 0 }
        direction: { type: string, enum: [in, out] }
        message_type: { type: [integer, 'null'], enum: [2, 3, 4, null] }
        action: { type: [string, 'null'] }
        unique_id: { type: string }
        validation_error: { type: [string, 'null'] }
        replayed: { type: boolean, description: 'Table 7 #6' }
    OcppMessageList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OcppMessage' } }

    # ---- sự cố ------------------------------------------------------------------------------
    FaultStatus:
      type: string
      enum: [raised, acknowledged, resetting, resolved]
    Fault:
      type: object
      required: [id, event_no, charge_point_id, serial_number, connector_no, source, severity, status, raised_at, station_online]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        event_no: { $ref: '#/components/schemas/Id' }
        charge_point_id: { $ref: '#/components/schemas/Id' }
        serial_number: { type: string }
        connector_no: { type: integer, minimum: 0, maximum: 2, description: '0 = cả trụ' }
        source: { type: string, enum: [ocpp, driver_report, operator] }
        error_code: { type: [string, 'null'] }
        severity: { type: string, enum: [critical, major, minor, none] }
        hint: { type: [string, 'null'], description: 'Hướng xử lý từ bảng mã lỗi (FE-04)' }
        status: { $ref: '#/components/schemas/FaultStatus' }
        raised_at: { $ref: '#/components/schemas/Timestamp' }
        acknowledged_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        resolved_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        reset_command_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        reset_command_status:
          oneOf:
            - $ref: '#/components/schemas/RemoteCommandStatus'
            - type: 'null'
        station_online: { type: boolean }
    FaultPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Fault' } }
    FaultTransition:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/FaultStatus' }
    FaultResetRequest:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [Soft, Hard], default: Soft }
        force: { type: boolean, default: false }
    FaultResetResult:
      type: object
      required: [fault_id, command_id, serial_number, reset_status, fault_status, forced]
      properties:
        fault_id: { $ref: '#/components/schemas/Id' }
        command_id: { $ref: '#/components/schemas/Id' }
        serial_number: { type: string }
        reset_status: { type: string, enum: [Accepted, Rejected] }
        fault_status: { $ref: '#/components/schemas/FaultStatus' }
        forced: { type: boolean }

    # ---- phiên / đối soát -------------------------------------------------------------------
    SessionStatus:
      type: string
      enum: [pending, active, paused, stopping, closed, review, reconciled, orphaned, failed]
    PaymentMode:
      type: string
      enum: [csms_billed, unattributed]
    SessionListItem:
      type: object
      required: [id, transaction_no, charge_point_id, serial_number, connector_no, origin, payment_mode, status, started_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        transaction_no: { type: integer }
        charge_point_id: { $ref: '#/components/schemas/Id' }
        serial_number: { type: string }
        connector_no: { type: integer, enum: [1, 2] }
        id_tag: { type: string, description: 'idTag trên dây; BR-P05 — chỉ role được phép thấy' }
        origin: { type: string, enum: [app_qr, rfid, hmi_password, free_vend] }
        payment_mode: { $ref: '#/components/schemas/PaymentMode' }
        status: { $ref: '#/components/schemas/SessionStatus' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        meter_start_wh: { type: integer }
        meter_stop_wh: { type: [integer, 'null'] }
        energy_wh: { type: [integer, 'null'] }
        stop_reason: { type: [string, 'null'] }
        delivered_offline: { type: boolean }
        has_conflict: { type: boolean }
        debit_vnd: { type: [integer, 'null'], description: 'Số đã trừ credit (session_debit), null nếu chưa quyết toán' }
    SessionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/SessionListItem' } }
    MeterValue:
      type: object
      required: [id, cp_timestamp, received_at, measurand, value, replayed]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        cp_timestamp: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        measurand: { type: string }
        value: { type: number }
        unit: { type: [string, 'null'] }
        context: { type: [string, 'null'] }
        phase: { type: [string, 'null'] }
        replayed: { type: boolean }
    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionListItem'
        - type: object
          required: [meter_values, pauses, reconciliation_records]
          properties:
            cp_started_at: { $ref: '#/components/schemas/Timestamp' }
            cp_stopped_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
            meter_values: { type: array, items: { $ref: '#/components/schemas/MeterValue' } }
            pauses:
              type: array
              items:
                type: object
                required: [paused_at, resumed_at, pause_cause]
                properties:
                  paused_at: { $ref: '#/components/schemas/Timestamp' }
                  resumed_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
                  pause_cause: { type: string, enum: [ev, evse] }
            reconciliation_records:
              type: array
              items: { $ref: '#/components/schemas/ReconciliationRecord' }
    ReconciliationKind:
      type: string
      enum: [conflict, gap_detected, replay, duplicate, orphan_stop, unknown_id_tag, meter_gap, late_sample]
    ReconciliationRecord:
      type: object
      required: [id, session_id, record_type, kind, reviewed, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        session_id: { $ref: '#/components/schemas/Id' }
        transaction_no: { type: [integer, 'null'] }
        record_type: { type: string }
        kind: { $ref: '#/components/schemas/ReconciliationKind' }
        gap_start: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        gap_end: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        energy_difference_wh: { type: [integer, 'null'] }
        reviewed: { type: boolean }
        resolution: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ReconciliationRecordPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ReconciliationRecord' } }
    ResolveReviewRequest:
      type: object
      additionalProperties: false
      required: [resolution, note]
      properties:
        resolution:
          type: string
          pattern: '^[a-z0-9_]{1,40}$'
          examples: [accepted_station_data]
        note: { type: string, minLength: 1, maxLength: 500 }
    ResolveReviewResult:
      type: object
      required: [session_id, status, records_reviewed, settlement]
      properties:
        session_id: { $ref: '#/components/schemas/Id' }
        status: { type: string, const: reconciled }
        records_reviewed: { type: integer, minimum: 0 }
        settlement: { type: [string, 'null'], enum: [posted, already_posted, pending, ineligible, null] }
    AssignSessionRequest:
      type: object
      required: [note]
      description: Giữ chỗ — trường xác định tài xế theo bản chốt của T102
      properties:
        note: { type: string, minLength: 1, maxLength: 500 }
    ChargeIntent:
      type: object
      required: [id, charge_point_id, serial_number, connector_no, requested_at, state]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        charge_point_id: { $ref: '#/components/schemas/Id' }
        serial_number: { type: string }
        connector_no: { type: integer, enum: [1, 2] }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        state: { type: string, enum: [uncertain, recovering, completed] }
        late_start_seen: { type: boolean, description: 'Trụ đã gửi StartTransaction muộn' }
    ChargeIntentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ChargeIntent' } }
    StartRecovery:
      type: object
      description: Một dòng `driver_start_recoveries` (migration 0005) kèm trạng thái hai lệnh
      required: [intent_id, fence_command_id, fence_status, evidence_note, released_vnd, fence_attempt, restore_attempt, created_at]
      properties:
        intent_id: { $ref: '#/components/schemas/Id' }
        fence_command_id: { $ref: '#/components/schemas/Id' }
        fence_status:
          type: string
          enum: [scheduled, pending, sent, accepted, rejected, timeout, failed]
        restore_command_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        restore_status:
          oneOf:
            - $ref: '#/components/schemas/RemoteCommandStatus'
            - type: 'null'
        evidence_note: { type: string }
        released_vnd: { type: integer, minimum: 0 }
        released_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        fence_attempt: { type: integer, minimum: 1 }
        restore_attempt: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    RetryRecoveryRequest:
      type: object
      additionalProperties: false
      required: [kind, note]
      properties:
        kind: { type: string, enum: [fence, restore] }
        note: { type: string, minLength: 1, maxLength: 500 }
    RecoverStopRequest:
      type: object
      additionalProperties: false
      required: [previous_command_id, note]
      properties:
        previous_command_id: { $ref: '#/components/schemas/Id' }
        note: { type: string, minLength: 1, maxLength: 500 }
    TariffBoundaryRequest:
      type: object
      additionalProperties: false
      required: [boundary_at, meter_wh, note]
      properties:
        boundary_at: { $ref: '#/components/schemas/Timestamp' }
        meter_wh: { type: integer, minimum: 0 }
        note: { type: string, minLength: 1, maxLength: 500 }

    # ---- biểu giá / khuyến mãi --------------------------------------------------------------
    TariffPeriod:
      type: object
      additionalProperties: false
      required: [band, time_start, time_end, price_per_kwh_vnd]
      properties:
        band: { type: string, enum: [off_peak, normal, peak], description: 'Enum `tariff_band` trong DB (xem mục mơ hồ #3)' }
        time_start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        time_end: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$', description: 'Không bao gồm; 24:00 = hết ngày' }
        price_per_kwh_vnd: { type: integer, minimum: 0 }
    TariffSchedule:
      type: object
      additionalProperties: false
      required: [effective_from, periods]
      properties:
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date, readOnly: true }
        periods: { type: array, minItems: 1, maxItems: 24, items: { $ref: '#/components/schemas/TariffPeriod' } }
    TariffScheduleView:
      type: object
      required: [current, upcoming]
      properties:
        current:
          oneOf:
            - $ref: '#/components/schemas/TariffSchedule'
            - type: 'null'
        upcoming: { type: array, items: { $ref: '#/components/schemas/TariffSchedule' } }
    Promotion:
      type: object
      required: [id, promotion_code, discount_type, discount_value, valid_from, valid_to, active]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        promotion_code: { type: string, maxLength: 20 }
        discount_type: { type: string, enum: [percent, fixed_vnd] }
        discount_value: { type: integer, minimum: 0, description: 'percent: 0–100; fixed_vnd: VND' }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
        active: { type: boolean, description: 'Tính ra: valid_from ≤ bây giờ < valid_to' }
    PromotionCreate:
      type: object
      additionalProperties: false
      required: [promotion_code, discount_type, discount_value, valid_from, valid_to]
      properties:
        promotion_code: { type: string, pattern: '^[A-Z0-9_-]{3,20}$' }
        discount_type: { type: string, enum: [percent, fixed_vnd] }
        discount_value: { type: integer, minimum: 0 }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
    PromotionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        discount_type: { type: string, enum: [percent, fixed_vnd] }
        discount_value: { type: integer, minimum: 0 }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
    PromotionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Promotion' } }

    # ---- doanh thu (BR-P46) -------------------------------------------------------------------
    RevenueBucket:
      type: object
      required: [csms_billed_session_count, csms_billed_energy_wh, csms_billed_revenue_vnd, unattributed_session_count, unattributed_energy_wh]
      properties:
        csms_billed_session_count: { type: integer, minimum: 0 }
        csms_billed_energy_wh: { type: integer, minimum: 0 }
        csms_billed_revenue_vnd: { type: integer, minimum: 0, description: 'Σ session_debit, mỗi phiên một lần' }
        unattributed_session_count: { type: integer, minimum: 0 }
        unattributed_energy_wh: { type: integer, minimum: 0, description: 'Không quy ra tiền' }
    RevenueRow:
      allOf:
        - type: object
          required: [key]
          properties:
            key: { type: string, description: 'Id của nhóm (charge_point/site/operator) hoặc ngày YYYY-MM-DD' }
            operator_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
            operator_name: { type: [string, 'null'] }
            site_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
            site_name: { type: [string, 'null'] }
            charge_point_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
            serial_number: { type: [string, 'null'] }
            day: { type: [string, 'null'], format: date }
        - $ref: '#/components/schemas/RevenueBucket'
    RevenueReport:
      type: object
      required: [from, to, group_by, currency, rows, totals, pending_reconciliation, generated_at]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        group_by: { type: string, enum: [operator, site, charge_point, day] }
        operator_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        currency: { type: string, const: VND }
        rows: { type: array, items: { $ref: '#/components/schemas/RevenueRow' } }
        totals: { $ref: '#/components/schemas/RevenueBucket' }
        pending_reconciliation:
          type: object
          description: Phiên csms_billed đã dừng trong kỳ nhưng chưa reconciled — chưa tính vào doanh thu
          required: [session_count]
          properties:
            session_count: { type: integer, minimum: 0 }
        generated_at: { $ref: '#/components/schemas/Timestamp' }

    # ---- tài khoản / operator / thẻ -----------------------------------------------------------
    UserRole:
      type: string
      enum: [driver, operator_staff, admin]
    AccountStatus:
      type: string
      enum: [active, suspended, closed]
    UserAccount:
      type: object
      required: [id, email, full_name, role, account_status, operator, staff_role, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        full_name: { type: string }
        phone_number: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/UserRole' }
        account_status: { $ref: '#/components/schemas/AccountStatus' }
        operator:
          oneOf:
            - $ref: '#/components/schemas/OperatorRef'
            - type: 'null'
        staff_role: { type: [string, 'null'], enum: [manager, technician, null] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    UserAccountPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/UserAccount' } }
    CreateStaffUserRequest:
      type: object
      additionalProperties: false
      required: [email, full_name, role, initial_password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        full_name: { type: string, minLength: 1, maxLength: 100 }
        phone_number: { type: [string, 'null'], pattern: '^\+[1-9][0-9]{6,14}$' }
        role: { type: string, enum: [operator_staff, admin] }
        operator_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: Bắt buộc khi role = operator_staff
        staff_role: { type: string, enum: [manager, technician], description: 'Bắt buộc khi role = operator_staff' }
        initial_password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100 }
        phone_number: { type: [string, 'null'], pattern: '^\+[1-9][0-9]{6,14}$' }
    SetRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [operator_staff, admin] }
        operator_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: Bắt buộc khi role = operator_staff
        staff_role: { type: string, enum: [manager, technician] }
    Operator:
      type: object
      required: [id, tax_code, legal_name, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        tax_code: { type: string, maxLength: 14 }
        legal_name: { type: string }
        status: { type: string, enum: [active, suspended, closed] }
    OperatorPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Operator' } }
    CardKind:
      type: string
      enum: [online, free_vend]
    CardStatus:
      type: string
      enum: [unlinked, active, blocked]
    RfidCard:
      type: object
      required: [id, card_identifier, card_kind, status, driver, issued_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        card_identifier: { type: string, maxLength: 20 }
        card_kind: { $ref: '#/components/schemas/CardKind' }
        status: { $ref: '#/components/schemas/CardStatus' }
        driver:
          oneOf:
            - type: object
              required: [id, email, full_name]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                email: { type: string, format: email }
                full_name: { type: string }
            - type: 'null'
        issued_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    RfidCardPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/RfidCard' } }
    RfidCardCreate:
      type: object
      additionalProperties: false
      required: [card_identifier, card_kind]
      properties:
        card_identifier: { type: string, minLength: 1, maxLength: 20 }
        card_kind: { $ref: '#/components/schemas/CardKind' }
        driver_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
    RfidCardPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        driver_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        status: { type: string, enum: [active, blocked] }

    # ---- admin tóm tắt / ngoại lệ thanh toán ---------------------------------------------------
    AdminSummary:
      type: object
      required: [users, charge_points, rfid_cards, billing_exceptions]
      properties:
        users:
          type: object
          required: [driver, operator_staff, admin, suspended]
          properties:
            driver: { type: integer, minimum: 0 }
            operator_staff: { type: integer, minimum: 0 }
            admin: { type: integer, minimum: 0 }
            suspended: { type: integer, minimum: 0 }
        charge_points:
          type: object
          required: [by_lifecycle, online]
          properties:
            by_lifecycle:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
            online: { type: integer, minimum: 0 }
        rfid_cards:
          type: object
          required: [active, blocked, unlinked]
          properties:
            active: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
            unlinked: { type: integer, minimum: 0 }
        billing_exceptions:
          type: object
          required: [late_payments, invoices_needs_review, failed_refunds]
          properties:
            late_payments: { type: integer, minimum: 0 }
            invoices_needs_review: { type: integer, minimum: 0 }
            failed_refunds: { type: integer, minimum: 0 }
    BillingItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                description: Hình dạng phần tử do WF-02 D10 chốt (Khang); hợp đồng này chỉ chốt phong bì
    RefundRequested:
      type: object
      required: [refund_id, status]
      properties:
        refund_id: { $ref: '#/components/schemas/Id' }
        status: { type: string, const: requested }
    EInvoiceRetryResult:
      oneOf:
        - type: object
          required: [status, invoice_no]
          properties:
            status: { type: string, const: issued }
            invoice_no: { type: string }
        - type: object
          required: [status, attempt_count, last_error_kind, last_error_message]
          properties:
            status: { type: string, const: needs_review }
            attempt_count: { type: integer, minimum: 1 }
            last_error_kind: { type: string, enum: [transient, data] }
            last_error_message: { type: string }
