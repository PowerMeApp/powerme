openapi: 3.1.0
info:
  title: PowerMe CSMS — Operator & Admin API
  version: 0.1.0
  summary: Hợp đồng REST cho Operator Dashboard và Admin Console (T98)
  description: |
    Hợp đồng giữa CSMS (WP2) và dashboard React (WP4) cho hai bề mặt:
    `/api/operator/v1` (nhân viên operator, role `operator_staff`) và `/api/admin/v1`
    (quản trị nền tảng, role `admin`). Văn bản giải thích, ma trận role × endpoint, ánh xạ từ
    console hiện tại và câu hỏi mở nằm ở `OPERATOR-ADMIN-API-HOP-DONG.md` cùng thư mục.

    Đăng nhập là một route chung `/api/auth/v1/login` cho cả hai bề mặt (ADR-0018), làm mới
    access token qua `/api/auth/v1/refresh` (quyết định 12/11, T125 — chưa có code). Mọi
    `/api/operator/v1/*` và `/api/admin/v1/*` đi qua RolesGuard **trước khi khớp route**: đường
    dẫn chưa có route mà không có token hợp lệ nhận 401, không phải 404.

    Hành vi hiện tại của listener (`operator-api.http.ts`, main 9c90f34), áp cho mọi route kể cả
    route chưa viết:
    - Request có header `Origin` không phải `http(s)://localhost|127.0.0.1|[::1]` (cổng bất kỳ)
      → 403 `forbidden_origin` trước mọi thứ khác. Preflight `OPTIONS` từ localhost → 204.
    - Có query string (kể cả `?` rỗng) → 400 `invalid_input` **trước** guard. Sẽ đổi khi viết
      route đầu tiên có tham số query (danh sách); các tham số query trong file này là hợp đồng
      cho lúc đó.
    - Lỗi của tầng xác thực trả `{error, detail}` với `detail` = chính mã lỗi (chưa có câu tiếng
      Việt); 500 trả `internal_error`.
    - Chưa cấu hình `DASHBOARD_JWT_*` → mọi route 503 `auth_unavailable`.

    Mỗi operation có bốn khoá mở rộng:
    - `x-roles`: role được gọi (nguồn sinh ma trận NFR-05). Role khác có token hợp lệ → 403.
    - `x-status`: `implemented` (route chạy trên main, có JWT), `console` (logic đã chạy ở
      console `/api/admin/*` chưa xác thực, phải chuyển sang đây), `service` (service/hàm có
      trong code, route chưa), `in_progress` (đang làm ở nhánh khác), `planned` (chưa có code).
    - `x-owner`: người làm route (theo WP; BM04 không có trong repo — Trí sửa nếu lệch).
    - `x-refs`: UC / FR / BR / STM trong SRS (report3-srs.md), phiếu v1.3 và thiết kế.
    Riêng hai route đăng nhập / refresh có thêm `x-target`: trạng thái đích theo T125 khi code
    hiện tại khác hợp đồng.

    Quy ước chung giống Driver API (`driver-api.openapi.yaml`):
    - JSON snake_case. Tiền là số nguyên VND, điện năng là số nguyên Wh, thời gian ISO 8601 UTC;
      ngày (`date`) là ngày lịch Asia/Ho_Chi_Minh.
    - Id bigint trả dạng **chuỗi số** (`"id": "12"`).
    - Lỗi luôn là `{error, detail}`; `error` là mã ổn định snake_case.
    - Danh sách phân trang: `page` (từ 1), `page_size` (1–100, mặc định 50) → `{items, total,
      page, page_size}`. Nhật ký OCPP dùng con trỏ `after` + `limit` để poll.
    - Phiên chỉ có `payment_mode` ∈ {`csms_billed`, `unattributed`} và thẻ RFID chỉ có
      `card_kind` ∈ {`online`, `free_vend`} (theo T110).
  x-owner: Trí (WP2) — hợp đồng; route theo `x-owner` từng operation
  x-status: >-
    v0.1 — hợp đồng; trên main 9c90f34 chỉ có `POST /auth/v1/login`, `GET /operator/v1/me`,
    `GET /admin/v1/me` (FE-01a #118, ADR-0018); các route còn lại chưa có. Từ 12/11 (Ân chốt,
    T125) hợp đồng là **đích**: access token 900 s + `POST /auth/v1/refresh`; code hiện vẫn phát
    token 8 giờ, không refresh — chỗ nào khác nhau có ghi "hiện tại" trong mô tả
servers:
  - url: http://localhost:3000/api
    description: CSMS cục bộ (cùng tiến trình, cùng cổng với console và Driver API)
tags:
  - name: auth
    description: Đăng nhập nhân viên operator và admin, hồ sơ người gọi (F-13, ADR-0018)
  - name: onboarding
    description: UC-OPS-01, UC-ADM-03, UC-ADM-05 — đăng ký serial, onboard trụ, vòng đời STM-3
  - name: monitoring
    description: UC-OPS-02, UC-OPS-04 — trạng thái trụ/súng, chỉ số BR-P43, lệnh từ xa
  - name: faults
    description: UC-OPS-03 — cảnh báo sự cố (WF-04, STM-6)
  - name: sessions
    description: UC-OPS-05 — phiên, đối soát, phiên review / unattributed, khôi phục lệnh (T72)
  - name: tariffs
    description: UC-OPS-06, UC-OPS-07 — biểu giá theo giờ và khuyến mãi
  - name: revenue
    description: UC-OPS-09, UC-ADM-10 — doanh thu theo BR-P46, xuất CSV
  - name: accounts
    description: UC-ADM-01, UC-ADM-02 — tài khoản và role
  - name: cards
    description: UC-ADM-04 — sổ thẻ RFID
  - name: platform
    description: UC-ADM-07 — tổng quan nền tảng, nhật ký giao dịch và bản tin OCPP
  - name: billing-exceptions
    description: UC-ADM-08 — ngoại lệ thanh toán (hình dạng chi tiết ở WF-02 D10, Khang)

security:
  - bearerAuth: []

paths:
  # ============================================================================================
  # AUTH (FE-01a #118, ADR-0018 — đã chạy trên main 9c90f34)
  # ============================================================================================
  /auth/v1/login:
    post:
      tags: [auth]
      operationId: dashboardLogin
      x-roles: [public]
      x-status: implemented
      x-target: >-
        implemented (8 h, không refresh) — đích 900 s + refresh theo T125 (quyết định Ân 12/11;
        owner chờ phân công, đề xuất Nghĩa)
      x-owner: Nghĩa (FE-01a, #118); thay đổi T125 chờ phân công
      x-refs: [F-13, UC-ACC-04, UC-ACC-05, BR-P16, NFR-SEC-01, ADR-0018, T125]
      summary: Nhân viên operator và Admin đăng nhập email + mật khẩu (một endpoint, màn 16 và 26)
      description: |
        Một endpoint cho cả hai vai trò (ADR-0018 #1). Token mang `role`; màn đăng nhập của mỗi
        khu vực (dashboard `/operator/login`, `/admin/login`) tự từ chối vai trò còn lại, không lưu
        token. Code: `apps/csms/src/users/auth.ts` (`StaffAccounts.login`), route ở
        `apps/csms/src/operator-api/operator-api.http.ts`.

        - Body đúng hai khoá `email`, `password` (chuỗi). Thiếu, sai kiểu hoặc có khoá lạ
          (vd `role`) → 400 `invalid_input`. Content-Type phải là `application/json` (tuỳ chọn
          `; charset=utf-8`), không thì 415; body tối đa 16 KiB, quá thì 413; JSON hỏng → 400.
        - `email` được `trim()` + chữ thường rồi so `lower(users.email)`; không kiểm định dạng.
          `email` > 254 ký tự hoặc `password` > 128 code point → 401 `invalid_credentials`
          (không phải 400, không tính vào bộ đếm thử sai).
        - Sai email, sai mật khẩu, user là tài xế, `operator_staff` không có dòng
          `operator_staff`, `admin` không có dòng `admins`: cùng **401** `invalid_credentials`;
          email không tồn tại vẫn băm giả một lần để thời gian như nhau.
        - Chỉ **sau khi mật khẩu đúng**: `account_status ≠ active` → 403 `account_locked`;
          nhân viên có Operator `status ≠ active` → 403 `operator_inactive`.
        - Thử sai (bộ đếm riêng của dashboard, cùng số BR-P49 / BE-21): 5 lần / 60 s theo email +
          IP, hoặc 20 lần / 60 s theo IP → khoá 15 phút, mọi lần thử trong lúc khoá (kể cả mật
          khẩu đúng) → 429 `too_many_attempts` + `Retry-After` (giây). Quá 20 lần đang băm song
          song từ một IP → 429 với `Retry-After: 1`. Đăng nhập đúng xoá bộ đếm email + IP. IP là
          `req.socket.remoteAddress` — chưa đọc `X-Forwarded-For` (xem §2.7 của hợp đồng).
        - Chưa cấu hình `DASHBOARD_JWT_*` (cả ba trống) → 503 `auth_unavailable`.
        - Access token: JWT HS256 `typ: JWT`, khoá `DASHBOARD_JWT_SECRET_BASE64`, `iss` / `aud`
          theo `DASHBOARD_JWT_ISSUER` / `_AUDIENCE`; claim `sub` (users.id), `role`, `iat`, `exp`,
          `jti` (UUID); nhân viên thêm `operator_id`, `staff_role`.
        - **Đích (T125, Ân chốt 12/11):** `exp` = `iat` + **900 s**, response thêm
          `refresh_token` + `refresh_expires_in` (xem `POST /auth/v1/refresh`). **Hiện tại (main,
          #118):** `exp` = `iat` + 28 800 s (8 giờ), `expires_in: 28800`, không có hai trường
          refresh — dashboard phải chịu được cả hai cho tới khi T125 merge (đọc `expires_in`,
          không gán cứng; thiếu `refresh_token` thì hết hạn là đăng nhập lại).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access token (đích 900 s; hiện 8 giờ), refresh token (đích) và người dùng (cùng hình dạng với `/me`)
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /auth/v1/refresh:
    post:
      tags: [auth]
      operationId: dashboardRefresh
      x-roles: [public]
      x-status: planned
      x-target: planned · T125 (Ân chốt 12/11) — owner chờ phân công; đề xuất Nghĩa vì #118 là của Nghĩa
      x-owner: chờ phân công (đề xuất Nghĩa, T125)
      x-refs: [F-13, UC-ACC-04, UC-ACC-05, BR-P16, NFR-SEC-01, ADR-0018, T125, BE-21]
      summary: Đổi refresh token lấy access token 900 s mới (không phát refresh token mới)
      description: |
        **Chưa có code** — hiện route này nhận 404 `not_found` như mọi đường dẫn chưa có dưới
        `/api/auth/v1`. Thiết kế theo Driver API `/auth/refresh` (BE-21,
        `apps/csms/src/driver/driver-account.ts` `refresh()`), chỉ khác khoá ký và thời hạn:

        - Công khai (không cần access token — access token đã hết hạn là lúc gọi route này).
          Cùng luật vào như đăng nhập: `Content-Type: application/json` (415), body ≤ 16 KiB (413),
          chỉ `POST` (405 + `Allow`), body đúng **một** khoá `refresh_token` (khoá lạ → 400).
        - Refresh token là JWT HS256 **riêng loại**: header `typ: refresh+jwt`, claim
          `token_use: refresh`, `sub`, `iat`, `exp`, `jti`, **không có `role`**; nhân viên có thêm
          `operator_id` (để phát hiện bị chuyển Operator). Ký cùng `DASHBOARD_JWT_SECRET_BASE64`,
          cùng `iss` / `aud` dashboard — không dùng khoá Driver API.
        - Không dùng thay nhau: RolesGuard đòi `typ: JWT` + claim `role` nên refresh token gọi
          `/operator/v1/*`, `/admin/v1/*` → 401 `unauthorized`; route này đòi `typ: refresh+jwt` +
          `token_use: refresh` nên access token gửi vào đây → 401 `invalid_refresh_token`. Refresh
          token của tài xế (khoá khác) → 401 `invalid_refresh_token`.
        - **Mỗi lần refresh kiểm lại DB** như bước 3 của RolesGuard: user không còn → 401
          `invalid_refresh_token`; `users.role` không phải `operator_staff` / `admin`, hoặc thiếu
          dòng `operator_staff` / `admins` → 403 `forbidden`; role trong DB khác role lúc đăng
          nhập (token có `operator_id` ⇔ lúc đăng nhập là nhân viên) hoặc `operator_id` trong DB
          khác claim → 401 `invalid_refresh_token` (đăng nhập lại); `account_status ≠ active` →
          403 `account_locked`; Operator ≠ `active` → 403 `operator_inactive`. Access token mới
          mang `role`, `operator_id`, `staff_role` đọc từ DB ở chính lần refresh này.
        - **Không xoay vòng**: response chỉ có access token mới, không có refresh token mới. Thời
          hạn refresh tính từ lúc đăng nhập; hết hạn thì đăng nhập lại — phiên không kéo dài vô
          hạn khi chưa thu hồi được từng token (không có bảng refresh token, như BE-21).
        - Thời hạn refresh cấu hình bằng `DASHBOARD_JWT_REFRESH_TTL_S`. **Đề xuất** mặc định
          43 200 s (12 giờ — một ca làm việc kể cả giao ca), giới hạn 3 600 … 86 400; ngoài
          khoảng → CSMS không khởi động (như `DRIVER_API_REFRESH_TTL_S`). Con số do Nghĩa chốt
          (câu hỏi N14 trong hợp đồng).
        - Không có bộ đếm thử sai (Driver API cũng không): refresh token sai không đoán được vì có
          chữ ký. `DASHBOARD_JWT_*` trống cả ba → 503 `auth_unavailable`.
        - Đăng xuất vẫn là dashboard xoá cả hai token; không có `logout` phía server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Access token mới (900 s); không có refresh token mới
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardAccessToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidRefreshToken' }
        '403': { $ref: '#/components/responses/RefreshForbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /operator/v1/me:
    get:
      tags: [auth]
      operationId: operatorMe
      x-roles: [operator_staff]
      x-status: implemented
      x-owner: Nghĩa (FE-01a, #118)
      x-refs: [BR-P16, 'Table 5 #17', ADR-0018]
      summary: Nhân viên và Operator đang đăng nhập (đầu trang Operator Dashboard, khôi phục phiên)
      description: |
        Trả `DashboardUser` có `operator_id`, `operator_name`, `staff_role`. Ba trường này lấy từ
        lần đọc DB của RolesGuard ở chính request này, không từ token — nhân viên vừa bị chuyển
        Operator nhận 401 (đăng nhập lại), không thấy Operator cũ.
      responses:
        '200':
          description: Người gọi
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardUser' }
              examples:
                staff:
                  value:
                    user_id: '42'
                    email: tech@operator-a.vn
                    full_name: Nguyễn Văn A
                    role: operator_staff
                    operator_id: '3'
                    operator_name: Công ty TNHH Trạm Sạc A
                    staff_role: technician
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin/v1/me:
    get:
      tags: [auth]
      operationId: adminMe
      x-roles: [admin]
      x-status: implemented
      x-owner: Nghĩa (FE-01a, #118)
      x-refs: [BR-P16, 'Table 5 #27', ADR-0018]
      summary: Admin đang đăng nhập
      description: |
        Trả `DashboardUser` **không có** `operator_id`, `operator_name`, `staff_role` (khoá vắng
        mặt, không phải `null`). Guard đòi user còn `role = admin`, `active` và còn dòng `admins`.
      responses:
        '200':
          description: Người gọi
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardUser' }
              examples:
                admin:
                  value:
                    user_id: '7'
                    email: admin@powerme.vn
                    full_name: Trần Thị B
                    role: admin
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  # ============================================================================================
  # ONBOARDING (operator) + REGISTRY (admin)
  # ============================================================================================
  /operator/v1/sites:
    get:
      tags: [onboarding]
      operationId: listOperatorSites
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Ân
      x-refs: [UC-OPS-01, BR-P11, 'Table 5 #19']
      summary: Các site của operator người gọi (ô chọn site trong sheet onboarding)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Site của operator, sắp theo `site_code`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/v1/charge-points:
    get:
      tags: [monitoring]
      operationId: listOperatorChargePoints
      x-roles: [operator_staff]
      x-status: console
      x-source: 'GET /api/admin/stations → ConsoleQueries.stations (không lọc operator)'
      x-owner: Nghĩa
      x-refs: [UC-OPS-02, FR-10, BR-P10, BR-P38, BR-P39, 'Table 5 #18']
      summary: Đội trụ của operator, kèm trạng thái sống từng súng
      description: |
        Chỉ trụ ở site của operator người gọi (BR-P16). Mỗi trụ có đúng các súng thật
        (BR-P10: tối đa 2), mỗi súng giữ trạng thái OCPP riêng — không gộp. `connected` là socket
        trong RAM của tiến trình; `is_online` là cột DB (ADR-0016 D-C), có thể lệch sau khi CSMS
        khởi động lại cho tới lượt quét.
      parameters:
        - name: site_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/ChargePointLifecycle' }
        - name: online
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Trụ của operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargePointPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [onboarding]
      operationId: onboardChargePoint
      x-roles: [operator_staff]
      x-status: service
      x-source: 'ChargePointOnboardingService.onboard (WF-05, PR #33/#35)'
      x-owner: Ân (T119)
      x-refs: [UC-OPS-01, FR-09, 'STM-3 #2', SD-5a, ADR-0011]
      summary: Onboard một serial đã đăng ký vào site của mình, nhận credential một lần
      description: |
        Serial phải đã được Admin đăng ký (`registered`). Tạo 1–2 súng `Unavailable`, đổi vòng đời
        sang `awaiting_connection`, sinh mật khẩu Basic Auth 24 ký tự, chỉ lưu băm scrypt và
        **trả mật khẩu đúng một lần** trong response này. Response có `Cache-Control: no-store`.
        Không idempotent theo kiểu phát lại: gọi lại cùng serial → 409 `already_onboarded`, mật
        khẩu không hiện lại (luồng cấp lại credential chưa có — câu hỏi mở cho Ân).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardRequest' }
      responses:
        '201':
          description: Đã onboard; credential hiện một lần
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`forbidden` (role), `site_of_other_operator` (site thuộc operator khác, SD-5a)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`site_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`serial_not_registered`, `already_onboarded`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

