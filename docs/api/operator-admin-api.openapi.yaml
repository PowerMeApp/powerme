openapi: 3.1.0
info:
  title: PowerMe CSMS — Operator & Admin API
  version: 0.1.0
  summary: Hợp đồng REST cho Operator Dashboard và Admin Console (T98)
  description: |
    Hợp đồng giữa CSMS (WP2) và dashboard React (WP4) cho hai bề mặt:
    `/api/operator/v1` (nhân viên operator, role `operator_staff`) và `/api/admin/v1`
    (quản trị nền tảng, role `admin`). Văn bản giải thích, ma trận role × endpoint, ánh xạ từ
    console hiện tại và câu hỏi mở nằm ở `OPERATOR-ADMIN-API-HOP-DONG.md` cùng thư mục.

    Mỗi operation có bốn khoá mở rộng:
    - `x-roles`: role được gọi (nguồn sinh ma trận NFR-05). Role khác có token hợp lệ → 403.
    - `x-status`: `console` (logic đã chạy ở console `/api/admin/*` chưa xác thực, phải chuyển
      sang đây), `service` (service/hàm có trong code, route chưa), `in_progress` (đang làm ở
      nhánh khác), `planned` (chưa có code).
    - `x-owner`: người làm route (theo WP; BM04 không có trong repo — Trí sửa nếu lệch).
    - `x-refs`: UC / FR / BR / STM trong SRS (report3-srs.md), phiếu v1.3 và thiết kế.

    Quy ước chung giống Driver API (`driver-api.openapi.yaml`):
    - JSON snake_case. Tiền là số nguyên VND, điện năng là số nguyên Wh, thời gian ISO 8601 UTC;
      ngày (`date`) là ngày lịch Asia/Ho_Chi_Minh.
    - Id bigint trả dạng **chuỗi số** (`"id": "12"`).
    - Lỗi luôn là `{error, detail}`; `error` là mã ổn định snake_case.
    - Danh sách phân trang: `page` (từ 1), `page_size` (1–100, mặc định 50) → `{items, total,
      page, page_size}`. Nhật ký OCPP dùng con trỏ `after` + `limit` để poll.
    - Phiên chỉ có `payment_mode` ∈ {`csms_billed`, `unattributed`} và thẻ RFID chỉ có
      `card_kind` ∈ {`online`, `free_vend`} (theo T110).
  x-owner: Trí (WP2) — hợp đồng; route theo `x-owner` từng operation
  x-status: v0.1 — hợp đồng; chưa route nào trong file này có xác thực JWT trên main 59eb4ba
servers:
  - url: http://localhost:3000/api
    description: CSMS cục bộ (cùng tiến trình, cùng cổng với console và Driver API)
tags:
  - name: auth
    description: Đăng nhập nhân viên operator và admin (F-13)
  - name: onboarding
    description: UC-OPS-01, UC-ADM-03, UC-ADM-05 — đăng ký serial, onboard trụ, vòng đời STM-3
  - name: monitoring
    description: UC-OPS-02, UC-OPS-04 — trạng thái trụ/súng, chỉ số BR-P43, lệnh từ xa
  - name: faults
    description: UC-OPS-03 — cảnh báo sự cố (WF-04, STM-6)
  - name: sessions
    description: UC-OPS-05 — phiên, đối soát, phiên review / unattributed, khôi phục lệnh (T72)
  - name: tariffs
    description: UC-OPS-06, UC-OPS-07 — biểu giá theo giờ và khuyến mãi
  - name: revenue
    description: UC-OPS-09, UC-ADM-10 — doanh thu theo BR-P46, xuất CSV
  - name: accounts
    description: UC-ADM-01, UC-ADM-02 — tài khoản và role
  - name: cards
    description: UC-ADM-04 — sổ thẻ RFID
  - name: platform
    description: UC-ADM-07 — tổng quan nền tảng, nhật ký giao dịch và bản tin OCPP
  - name: billing-exceptions
    description: UC-ADM-08 — ngoại lệ thanh toán (hình dạng chi tiết ở WF-02 D10, Khang)

security:
  - bearerAuth: []

paths:
  # ============================================================================================
  # AUTH
  # ============================================================================================
  /operator/v1/auth/login:
    post:
      tags: [auth]
      operationId: operatorLogin
      x-roles: [public]
      x-status: planned
      x-owner: Trí
      x-refs: [F-13, BR-P16, ADR-0017]
      summary: Nhân viên operator đăng nhập email + mật khẩu
      description: |
        Cùng cơ chế BE-21 của tài xế (scrypt, 5 lần sai / 60 s theo email + IP → 429 15 phút),
        khác ở chỗ user phải có `role = operator_staff`, dòng `operator_staff` và operator
        `active`. User role khác → 401 `invalid_credentials` (không lộ email nào là nhân viên).
        Tài khoản `suspended`/`closed` → 403 `account_locked`; operator bị đình chỉ → 403
        `operator_inactive`; cả hai chỉ trả khi mật khẩu đúng.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access + refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /operator/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: operatorRefresh
      x-roles: [public]
      x-status: planned
      x-owner: Trí
      x-refs: [F-13, ADR-0017]
      summary: Đổi refresh token lấy access token mới
      description: Kiểm lại DB như login; khoá tài khoản có hiệu lực ngay ở lần refresh kế tiếp.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Access token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidRefreshToken' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /operator/v1/me:
    get:
      tags: [auth]
      operationId: operatorMe
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Trí
      x-refs: [BR-P16, 'Table 5 #17']
      summary: Hồ sơ nhân viên và operator đang đăng nhập (đầu trang Operator Dashboard)
      responses:
        '200':
          description: Người gọi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/auth/login:
    post:
      tags: [auth]
      operationId: adminLogin
      x-roles: [public]
      x-status: planned
      x-owner: Trí
      x-refs: [F-13, BR-P16, ADR-0017]
      summary: Admin đăng nhập email + mật khẩu
      description: Như `operatorLogin` nhưng user phải có `role = admin` và dòng `admins`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access + refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: adminRefresh
      x-roles: [public]
      x-status: planned
      x-owner: Trí
      x-refs: [F-13, ADR-0017]
      summary: Đổi refresh token lấy access token mới
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Access token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidRefreshToken' }
        '403': { $ref: '#/components/responses/AccountLocked' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin/v1/me:
    get:
      tags: [auth]
      operationId: adminMe
      x-roles: [admin]
      x-status: planned
      x-owner: Trí
      x-refs: [BR-P16, 'Table 5 #27']
      summary: Hồ sơ admin đang đăng nhập
      responses:
        '200':
          description: Người gọi (`operator` = null, `staff_role` = null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================================================
  # ONBOARDING (operator) + REGISTRY (admin)
  # ============================================================================================
  /operator/v1/sites:
    get:
      tags: [onboarding]
      operationId: listOperatorSites
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Ân
      x-refs: [UC-OPS-01, BR-P11, 'Table 5 #19']
      summary: Các site của operator người gọi (ô chọn site trong sheet onboarding)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Site của operator, sắp theo `site_code`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/v1/charge-points:
    get:
      tags: [monitoring]
      operationId: listOperatorChargePoints
      x-roles: [operator_staff]
      x-status: console
      x-source: 'GET /api/admin/stations → ConsoleQueries.stations (không lọc operator)'
      x-owner: Nghĩa
      x-refs: [UC-OPS-02, FR-10, BR-P10, BR-P38, BR-P39, 'Table 5 #18']
      summary: Đội trụ của operator, kèm trạng thái sống từng súng
      description: |
        Chỉ trụ ở site của operator người gọi (BR-P16). Mỗi trụ có đúng các súng thật
        (BR-P10: tối đa 2), mỗi súng giữ trạng thái OCPP riêng — không gộp. `connected` là socket
        trong RAM của tiến trình; `is_online` là cột DB (ADR-0016 D-C), có thể lệch sau khi CSMS
        khởi động lại cho tới lượt quét.
      parameters:
        - name: site_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/ChargePointLifecycle' }
        - name: online
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Trụ của operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargePointPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [onboarding]
      operationId: onboardChargePoint
      x-roles: [operator_staff]
      x-status: service
      x-source: 'ChargePointOnboardingService.onboard (WF-05, PR #33/#35)'
      x-owner: Ân (T119)
      x-refs: [UC-OPS-01, FR-09, 'STM-3 #2', SD-5a, ADR-0011]
      summary: Onboard một serial đã đăng ký vào site của mình, nhận credential một lần
      description: |
        Serial phải đã được Admin đăng ký (`registered`). Tạo 1–2 súng `Unavailable`, đổi vòng đời
        sang `awaiting_connection`, sinh mật khẩu Basic Auth 24 ký tự, chỉ lưu băm scrypt và
        **trả mật khẩu đúng một lần** trong response này. Response có `Cache-Control: no-store`.
        Không idempotent theo kiểu phát lại: gọi lại cùng serial → 409 `already_onboarded`, mật
        khẩu không hiện lại (luồng cấp lại credential chưa có — câu hỏi mở cho Ân).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardRequest' }
      responses:
        '201':
          description: Đã onboard; credential hiện một lần
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`forbidden` (role), `site_of_other_operator` (site thuộc operator khác, SD-5a)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`site_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`serial_not_registered`, `already_onboarded`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /operator/v1/charge-points/{chargePointId}:
    get:
      tags: [monitoring]
      operationId: getOperatorChargePoint
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Nghĩa
      x-refs: [UC-OPS-02, UC-OPS-04, 'Table 5 #20']
      summary: Chi tiết trụ — súng, sự cố gần đây, lệnh gần đây
      parameters:
        - $ref: '#/components/parameters/chargePointId'
      responses:
        '200':
          description: Chi tiết
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargePointDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/v1/charge-points/{chargePointId}/metrics:
    get:
      tags: [monitoring]
      operationId: getChargePointMetrics
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Trí
      x-refs: [UC-OPS-02, FR-10, BR-P43, ADR-0015]
      summary: Uptime, utilisation, số sự cố, tỉ lệ khởi động hỏng trong 7 hoặc 30 ngày
      description: |
        Tính từ `connector_status_events` trên đồng hồ CSMS (BR-P43). Uptime = phần thời gian không
        `Faulted`, `Unavailable` hoặc offline; utilisation = phần thời gian "In use" (BR-P38).
        Tỉ lệ là số thực 0–1, null khi cửa sổ chưa có dữ liệu.
      parameters:
        - $ref: '#/components/parameters/chargePointId'
        - name: window
          in: query
          schema: { type: string, enum: [7d, 30d], default: 7d }
      responses:
        '200':
          description: Chỉ số theo trụ và từng súng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargePointMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/v1/charge-points/{chargePointId}/disable:
    post:
      tags: [onboarding]
      operationId: disableChargePoint
      x-roles: [operator_staff]
      x-status: planned
      x-source: 'ChargePointLifecyclePolicy (STM-3 #4) — chỉ có policy, chưa có service ghi DB'
      x-owner: Ân
      x-refs: [UC-OPS-02, 'STM-3 #4', ADR-0016 D-C, BR-P07]
      summary: Đưa trụ ra khỏi vận hành (in_service → disabled)
      parameters:
        - $ref: '#/components/parameters/chargePointId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteRequest' }
      responses:
        '200':
          description: Vòng đời mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /operator/v1/charge-points/{chargePointId}/enable:
    post:
      tags: [onboarding]
      operationId: enableChargePoint
      x-roles: [operator_staff]
      x-status: planned
      x-source: 'ChargePointLifecyclePolicy (STM-3 #5)'
      x-owner: Ân
      x-refs: [UC-OPS-02, 'STM-3 #5', ADR-0016 D-C]
      summary: Đưa trụ trở lại vận hành (disabled → in_service)
      parameters:
        - $ref: '#/components/parameters/chargePointId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteRequest' }
      responses:
        '200':
          description: Vòng đời mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /admin/v1/charge-points:
    get:
      tags: [onboarding]
      operationId: listRegistryChargePoints
      x-roles: [admin]
      x-status: console
      x-source: 'GET /api/admin/stations (một phần: thiếu model, firmware, bảo hành, operator)'
      x-owner: Ân
      x-refs: [UC-ADM-03, UC-ADM-07, FR-15, 'Table 5 #29']
      summary: Sổ đăng ký trụ toàn nền tảng
      parameters:
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/ChargePointLifecycle' }
        - name: operator_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: q
          in: query
          description: Tìm theo serial hoặc display_code (tiền tố, không phân biệt hoa thường)
          schema: { type: string, minLength: 1, maxLength: 48 }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Trụ trong sổ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryChargePointPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [onboarding]
      operationId: registerChargePoint
      x-roles: [admin]
      x-status: service
      x-source: 'ChargePointOnboardingService.registerDevice'
      x-owner: Ân (T119)
      x-refs: [UC-ADM-03, FR-15, 'STM-3 #1']
      summary: Thêm serial vào sổ đăng ký (vòng đời registered)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
      responses:
        '201':
          description: Đã đăng ký
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryChargePoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`serial_already_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/v1/charge-points/{chargePointId}:
    get:
      tags: [onboarding]
      operationId: getRegistryChargePoint
      x-roles: [admin]
      x-status: planned
      x-owner: Ân
      x-refs: [UC-ADM-03]
      summary: Một trụ trong sổ đăng ký
      parameters:
        - $ref: '#/components/parameters/chargePointId'
      responses:
        '200':
          description: Trụ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryChargePoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [onboarding]
      operationId: updateRegistryChargePoint
      x-roles: [admin]
      x-status: planned
      x-owner: Ân
      x-refs: [UC-ADM-03]
      summary: Sửa model, firmware, công suất danh định, hạn bảo hành
      description: Không đổi được serial (là OCPP identity và tên Basic Auth) hay vòng đời.
      parameters:
        - $ref: '#/components/parameters/chargePointId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistryChargePointPatch' }
      responses:
        '200':
          description: Trụ sau khi sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryChargePoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/charge-points/{chargePointId}/free-vend-tag:
    put:
      tags: [onboarding]
      operationId: setFreeVendTag
      x-roles: [admin]
      x-status: planned
      x-owner: Ân
