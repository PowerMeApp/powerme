      x-owner: Nghĩa
      x-refs: [UC-OPS-03, UC-OPS-04, STM-6 t4, BR-P07, 'WF-04 #12']
      summary: Gửi Reset cho trụ của sự cố đã acknowledged
      description: |
        Đồng bộ (chờ trụ trả lời tối đa 15 s) vì kết quả quyết định trạng thái sự cố: Accepted →
        `resetting`, Rejected → `acknowledged`, trụ không trả lời → 502 và lệnh `failed`. Trụ còn
        phiên đang sạc ở súng khác → 409 `sessions_active` (detail liệt kê súng/phiên); gửi lại với
        `force = true` thì lệnh ghi `payload.force = true`. Console nhận `type`/`force` qua query;
        hợp đồng chuyển vào body.
      parameters:
        - $ref: '#/components/parameters/faultId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
