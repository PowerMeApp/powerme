      operationId: getTariffSchedule
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Nghĩa (+ Khang)
      x-refs: [UC-OPS-06, FR-12, BR-P02, 'Table 5 #23']
      summary: Biểu giá đang hiệu lực và các bản sắp hiệu lực của operator
      parameters:
        - name: at
          in: query
          description: Ngày xem (mặc định hôm nay, Asia/Ho_Chi_Minh)
          schema: { type: string, format: date }
      responses:
        '200':
          description: Biểu giá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TariffScheduleView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [tariffs]
      operationId: putTariffSchedule
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Nghĩa (+ Khang)
      x-refs: [UC-OPS-06, FR-12, BR-P02, BR-P45]
      summary: Đặt biểu giá mới từ một ngày; không sửa bản đã hiệu lực
      description: |
        Các khung phải phủ kín 24 giờ, không chồng nhau; khung qua nửa đêm tách hai dòng (như bảng
        `tariff_periods`). `effective_from` ≥ hôm nay; bản cũ được đặt `effective_to` = ngày trước
        đó. Phiên đã quyết toán không đổi vì giá đã nằm trong `session_tariff_segments`.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TariffSchedule' }
      responses:
        '200':
          description: Biểu giá sau khi đặt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TariffScheduleView' }
        '400':
          description: '`invalid_input`, `tariff_gap_or_overlap`, `effective_from_in_past`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
