  # ============================================================================================
  # REVENUE (operator + admin) — BR-P46
  # ============================================================================================
  /operator/v1/revenue:
    get:
      tags: [revenue]
      operationId: getOperatorRevenue
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Khang (T108)
      x-refs: [UC-OPS-09, FR-18, BR-P46, BR-P45, BR-P08, 'Table 5 #25']
      summary: Doanh thu của operator theo trụ, site hoặc ngày (BR-P46)
      description: |
        `revenue_vnd` = tổng `session_debit` của phiên `payment_mode = csms_billed` và
        `status = reconciled`, mỗi phiên tính đúng một lần (unique index
        `credit_transactions_one_debit_per_session`), chỉ trụ của operator người gọi. Phiên
        `unattributed` là dòng riêng, chỉ đếm phiên và Wh, không có tiền. Không tính phí nền tảng,
        không chia doanh thu. Phiên được xếp vào kỳ theo `ended_at` (đồng hồ CSMS) quy về ngày
        Asia/Ho_Chi_Minh. Phiên csms_billed đã dừng nhưng chưa reconciled được đếm ở
        `pending_reconciliation` để người xem biết số còn có thể đổi.
      parameters:
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/revenueGroupBy'
        - name: site_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Báo cáo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevenueReport' }
        '400': { $ref: '#/components/responses/RevenueBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/v1/revenue.csv:
    get:
      tags: [revenue]
      operationId: exportOperatorRevenueCsv
      x-roles: [operator_staff]
      x-status: planned
      x-owner: Khang (T108)
      x-refs: [UC-OPS-09, BR-P46]
      summary: Cùng báo cáo, dạng CSV — khớp từng dòng và dòng tổng với màn hình
      description: |
        Cùng tham số và cùng truy vấn với `GET /revenue`; CSV UTF-8 có BOM (Excel đọc đúng tiếng
        Việt), dấu phẩy, số nguyên không định dạng nghìn, dòng cuối `TOTAL`. Cột theo thứ tự các
        trường của `RevenueRow` rồi `RevenueBucket` (csms_billed_*, unattributed_*).
      parameters:
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/revenueGroupBy'
        - name: site_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Tệp CSV
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="revenue_2026-11-01_2026-11-30.csv"'] }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/RevenueBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

