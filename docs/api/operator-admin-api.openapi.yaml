  /admin/v1/transactions:
    get:
      tags: [revenue]
      operationId: listPlatformTransactions
      x-roles: [admin]
      x-status: planned
      x-owner: Khang (T108)
      x-refs: [UC-ADM-10, BR-P46, F-16, 'Table 5 #35', K3]
      summary: Danh sách giao dịch sạc của nền tảng theo kỳ, Operator, trạm, loại (màn 35)
      description: |
        Một dòng = **một phiên sạc đã dừng** (một OCPP transaction), không phải một dòng sổ cái:
        top-up, hoàn tiền, hoá đơn điện tử thuộc tài xế, không thuộc Operator nào nên không có
        trong danh sách này (xem câu hỏi K7 của hợp đồng). Phiên đang chạy không có.

        - `kind` (loại) chia đúng ba nhóm của báo cáo doanh thu: `csms_billed` = phiên
          `payment_mode = csms_billed` **và** `status = reconciled` (vào doanh thu, BR-P46);
          `pending_reconciliation` = phiên csms_billed đã dừng nhưng chưa reconciled (chưa có
          tiền); `unattributed` = phiên `payment_mode = unattributed` (không có tiền, chỉ Wh).
        - Xếp kỳ theo K3 đã chốt trong hợp đồng (§4): phiên `reconciled` theo mốc giờ quyết toán
          đã dùng để tính giá (dự phòng `COALESCE(cp_stopped_at, received_stopped_at)` tới khi
          #120 chốt cách lưu), phiên còn lại theo `received_stopped_at`; ngày chia theo UTC+7,
          `[from 00:00, to + 1 ngày 00:00)` giờ VN, kỳ ≤ 366 ngày.
        - `totals` tính trên **toàn bộ** kết quả lọc (không chỉ trang đang xem). Không lọc
          `kind`, `site_id`, `charge_point_id`, `origin` thì `totals` bằng đúng `totals` của
          `GET /admin/v1/revenue` cùng `from`, `to`, `operator_id` — mỗi phiên tính một lần
          (BR-P46). Không có trường phí nền tảng hay phần chia.
        - Thứ tự cố định: `period_at` giảm dần rồi `session_id` giảm dần; CSV dùng đúng thứ tự
          này.
        - **Cột của `TransactionRow` là đề xuất — Khang và Nghĩa chốt** (§4.1 của hợp đồng).
      parameters:
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/txOperatorId'
        - $ref: '#/components/parameters/txSiteId'
        - $ref: '#/components/parameters/txChargePointId'
        - $ref: '#/components/parameters/txKind'
        - $ref: '#/components/parameters/txOrigin'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Một trang giao dịch và tổng của toàn bộ kết quả lọc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/TransactionsBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/transactions.csv:
    get:
      tags: [revenue]
      operationId: exportPlatformTransactionsCsv
      x-roles: [admin]
      x-status: planned
      x-owner: Khang (T108)
      x-refs: [UC-ADM-10, BR-P46, F-16, 'Table 5 #35']
      summary: Cùng danh sách giao dịch, dạng CSV — khớp màn hình, cho công ty khách hàng tự quyết toán
      description: |
        Cùng cách đặt đường dẫn với `revenue.csv` (đuôi `.csv`, không dùng `?format=csv`). Cùng
        tham số lọc và cùng truy vấn với `GET /admin/v1/transactions`, **không phân trang**: xuất
        mọi dòng của kết quả lọc, đúng thứ tự của màn hình, dòng cuối `TOTAL` bằng `totals` của
        JSON. Quá ngưỡng số dòng → 400 `export_too_large` (ngưỡng chờ chốt — K10).

        Định dạng đề xuất (giống `revenue.csv`, Khang/Nghĩa xác nhận — K9): UTF-8 có BOM (Excel đọc
        đúng tiếng Việt), dấu phẩy, dòng đầu là tên cột snake_case như JSON, tiền VND số nguyên
        không dấu nghìn, Wh số nguyên, ô trống cho `null`. Thời điểm ghi theo UTC+7 có offset
        (`2026-11-03T16:20:00+07:00`) — khác JSON (UTC `Z`) để người đọc Excel thấy giờ VN.
      parameters:
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/txOperatorId'
        - $ref: '#/components/parameters/txSiteId'
        - $ref: '#/components/parameters/txChargePointId'
        - $ref: '#/components/parameters/txKind'
        - $ref: '#/components/parameters/txOrigin'
      responses:
        '200':
          description: Tệp CSV
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="transactions_2026-11-01_2026-11-30.csv"'] }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/TransactionsBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

