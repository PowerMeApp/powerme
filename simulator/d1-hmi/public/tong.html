<!doctype html>
<!--
  tong.html — trang tổng của server trụ giả lập D1 (QA-03), mở tại "/".

  LÀM GÌ: liệt kê mọi trụ chạy trong tiến trình (CP_ID hoặc CP_IDS): online/offline, tốc độ mô
    phỏng, hàng đợi buffer, trạng thái từng súng (kW, kWh, SoC, transactionId) và link sang trang
    từng trụ /tru/<cpId> (nơi có HMI bấm được). Dữ liệu qua SSE /tong/events, không polling.
  VÌ SAO TÁCH: người test app tài xế cần thấy nhanh "trụ nào đang làm gì" trước khi mở một trụ.
  GIẢ ĐỊNH: mọi chữ đến từ OCPP/CSMS qua esc() trước khi vào HTML. Màu trạng thái giống tru.html.
  GIAO DIỆN (QA-06): token chung ở /static/bevel-tokens.css (style "Bevel": nền trắng, thẻ Cloud).
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trụ giả lập D1</title>
    <link rel="stylesheet" href="/static/bevel-tokens.css" />
    <style>
      body {
        padding-bottom: 96px;
      }
      .wrap {
        width: min(100% - 2 * var(--s3), 1520px);
        margin: 0 auto;
      }
      /* Cloudlight Hero: nền Hero Sky, tiêu đề Ink lớn, chữ phụ Body Gray */
      .hero {
        margin-top: var(--s3);
        padding: var(--s6) var(--s6) var(--s5);
        border-radius: var(--r-card-lg);
        background: var(--hero-sky);
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(2.25rem, 4.6vw, 4rem);
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .hero p {
        margin: var(--s2) 0 0;
        max-width: 60ch;
        color: var(--gray);
        font-size: 1.125rem;
        line-height: 1.4;
      }
      .hero p span {
        color: var(--ink);
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .sec-label {
        margin: var(--s10) 0 var(--s3);
        font-size: 1.5rem;
        line-height: 0.9;
        letter-spacing: -0.24px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 34rem), 1fr));
        gap: var(--s3);
      }
      .cp {
        background: var(--cloud);
        border-radius: var(--r-card);
        padding: var(--s4);
        min-width: 0;
      }
      .cp-head {
        display: flex;
        align-items: center;
        gap: var(--s2);
        flex-wrap: wrap;
        margin-bottom: var(--s1);
      }
      .cp-head h2 {
        font-size: 2rem;
        line-height: 1;
        margin: 0;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .meta {
        font-size: 0.9375rem;
        color: var(--gray);
        margin-bottom: var(--s3);
      }
      .meta b {
        color: var(--alert);
        font-weight: 500;
      }
      .guns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: var(--s2);
      }
      .gun {
        background: var(--paper);
        border-radius: var(--r-img);
        padding: 20px;
        min-width: 0;
      }
      .gun .name {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s1);
        flex-wrap: wrap;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: var(--s2);
      }
      .gun .name .bv-badge {
        background: var(--cloud);
      }
      .gun .big {
        font-size: 2.25rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .gun .big small {
        font-size: 0.9375rem;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--gray);
        margin-left: 4px;
      }
      .gun .nums {
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
        font-size: 0.9375rem;
        color: var(--gray);
      }
      .gun .nums b {
        color: var(--ink);
        font-weight: 500;
      }
      .gun .bar {
        margin-top: var(--s2);
        height: 6px;
        border-radius: var(--r-pill);
        background: var(--cloud);
        overflow: hidden;
      }
      .gun .bar i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--green);
      }
      .gun .hint {
        font-size: 0.875rem;
        color: var(--gray);
        margin-top: 12px;
        line-height: 1.35;
      }
      /* Charcoal Pill */
      a.open {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: var(--s3);
        padding: 12px 22px;
        border-radius: var(--r-btn);
        background: var(--charcoal);
        color: var(--on-charcoal);
        font-weight: 500;
        text-decoration: none;
        transition: transform 0.15s ease;
      }
      a.open:hover {
        transform: translateY(-1px);
      }
      a.open:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      #err {
        margin-top: var(--s3);
        padding: 14px 20px;
        border-radius: var(--r-img);
        background: var(--alert-soft);
        color: var(--alert);
        font-weight: 500;
      }
      #err[hidden] {
        display: none;
      }
      @media (max-width: 767px) {
        .wrap,
        .bv-nav {
          width: calc(100% - 2 * var(--s2));
        }
        .hero {
          padding: var(--s4) var(--s3);
          border-radius: var(--r-card);
        }
        .hero p {
          font-size: 1rem;
        }
        .sec-label {
          margin-top: var(--s6);
        }
        .cp {
          padding: var(--s3);
        }
        .guns {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <nav class="bv-nav" aria-label="Trụ giả lập D1">
      <span class="bv-brand"
        ><span class="bv-mark" aria-hidden="true"></span>PowerMe · Trụ giả lập D1</span
      >
      <span class="bv-spacer"></span>
      <span class="bv-badge" id="count" style="--c: var(--green)">...</span>
    </nav>
    <div class="wrap">
      <header class="hero">
        <h1>Trụ sạc giả lập D1</h1>
        <p>
          CSMS <span id="csms">...</span> · bấm "Mở trang trụ" để xem phiên sạc, kWh, nhật ký OCPP
          và bảng điều khiển của từng trụ
        </p>
      </header>
      <div id="err" hidden></div>
      <h2 class="sec-label">Các trụ đang chạy</h2>
      <main id="list"></main>
    </div>
    <footer class="bv-foot">Mô phỏng — hành vi chưa xác nhận bằng firmware Ruihua</footer>
    <script>
      const $ = (id) => document.getElementById(id);
      const q = new URLSearchParams(location.search);
      if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
      const esc = (v) =>
        String(v ?? '').replace(
          /[&<>"']/g,
          (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch],
        );
      const NET = {
        online: ['Online', 'var(--net-online)'],
        connecting: ['Đang nối...', 'var(--net-connecting)'],
        offline: ['OFFLINE', 'var(--net-offline)'],
      };
      function gunHint(st, c) {
        if (st.net.state !== 'online') return 'trụ offline — lệnh từ app không tới trụ';
        if (c.remoteWaitSec != null)
          return `đã nhận RemoteStart, chờ cắm súng (còn ${c.remoteWaitSec} s)`;
        if (c.txActive && c.txId == null) return 'chờ CSMS cấp transactionId';
        if (c.txActive) return `đang sạc · tx ${c.txId} · ${c.idTag}`;
        if (c.status === 'Finishing') return 'phiên xong, chờ rút súng';
        if (c.status === 'Faulted') return `lỗi ${c.errorCode}`;
        return c.plugged ? 'đã cắm súng, chờ lệnh' : 'chờ RemoteStart';
      }
      function render(d) {
        $('err').hidden = true;
        $('csms').textContent = d.csmsUrl;
        $('count').textContent = `${d.stations.length} trụ`;
        $('list').innerHTML = d.stations
          .map((st) => {
            const [nl, nc] = NET[st.net.state] ?? NET.offline;
            const net = nl + (st.net.halfOpen ? ' (half-open)' : '');
            const guns = st.connectors
              .map(
                (c) => `<div class="gun">
                  <div class="name"><span>Súng ${esc(c.label)}</span><span class="bv-badge" style="--c:var(--st-${esc(c.status)})">${esc(c.status)}</span></div>
                  <div class="big">${c.kw.toFixed(1)}<small>kW</small></div>
                  <div class="nums"><b>${c.kwh.toFixed(2)}</b> kWh · SoC <b>${c.soc == null ? '—' : c.soc.toFixed(1) + ' %'}</b></div>
                  <div class="bar" aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, c.soc ?? 0))}%"></i></div>
                  <div class="hint">${esc(gunHint(st, c))}</div></div>`,
              )
              .join('');
            return `<section class="cp" aria-label="Trụ ${esc(st.cpId)}">
              <div class="cp-head"><h2>${esc(st.name || st.cpId)}${
                st.name
                  ? `<span class="cp-serial">${
                      st.displayCode ? `Mã trên trụ: <b>${esc(st.displayCode)}</b> · ` : ''
                    }OCPP ${esc(st.cpId)}</span>`
                  : ''
              }</h2>
                <span class="bv-badge" style="--c:${nc}">${esc(net)}</span></div>
              ${st.address ? `<div class="meta">${esc(st.address)}</div>` : ''}<div class="meta">Tốc độ mô phỏng ×${esc(st.speed)} · hàng đợi buffer ${esc(st.queue)}${
                Math.abs(st.clockAheadSec) > 300
                  ? ' · <b>đồng hồ trụ lệch giờ thật &gt; 300 s</b>'
                  : ''
              }</div>
              <div class="guns">${guns}</div>
              <a class="open" href="/tru/${encodeURIComponent(st.cpId)}">Mở trang trụ ${esc(st.name || st.cpId)} →</a>
            </section>`;
          })
          .join('');
      }
      const es = new EventSource('/tong/events');
      es.addEventListener('tong', (ev) => render(JSON.parse(ev.data)));
      es.onerror = () => {
        $('err').hidden = false;
        $('err').textContent = 'Mất kết nối tới server trụ giả lập — đang thử lại...';
      };
    </script>
  </body>
</html>
