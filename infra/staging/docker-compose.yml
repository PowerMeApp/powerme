# PowerMe staging (T04/T84, kiến trúc ARCH-2): một VPS, Docker Compose. Image lấy từ GHCR, gắn tag
# bởi CI (.github/workflows/deploy-staging.yml). Hướng dẫn, rủi ro và việc làm tay: README.md.
#
# Biến ${...} đọc từ infra/staging/.env (xem .env.example). Mỗi dịch vụ nhận CHỈ những biến nó cần
# qua `environment:` — không dùng `env_file`, để secret của Postgres/simulator không lọt sang
# dịch vụ khác. Khác với kit ban đầu, KHÔNG có: dashboard (apps/dashboard chưa có mã build —
# thêm lại khi WP4 có), redis (apps/csms không dùng), JWT_SECRET/e-invoice (code không đọc;
# JWT của app tài xế là DRIVER_API_JWT_*, của dashboard là DASHBOARD_JWT_*, cả hai ở dịch vụ csms).
# VNPay (VNPAY_*) ở dịch vụ csms từ T32 Phần 6.
name: powerme

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN chưa đặt trong .env}
    depends_on:
      csms:
        condition: service_healthy
    logging: *default-logging

  csms:
    image: ${REGISTRY:?REGISTRY chưa đặt trong .env}/powerme-csms:${TAG:?TAG chưa đặt trong .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OCPP_PORT: '9000'
      OCPP_PUBLIC_URL: wss://${DOMAIN}/ocpp
      # Console vận hành CHƯA có xác thực. Trong container phải bind 0.0.0.0 thì cổng publish của
      # Docker mới tới được; mức an toàn nằm ở chỗ khác: (1) `ports` bên dưới chỉ publish ra
      # 127.0.0.1 của máy chủ, (2) Caddyfile KHÔNG proxy console (chỉ /ocpp/* và /health).
      # Xem bằng SSH tunnel (README.md). Đừng đổi hai điều kiện đó khi chưa có xác thực.
      CONSOLE_ENABLED: 'true'
      CONSOLE_HOST: 0.0.0.0
      # Bắt buộc từ MB-03: console và Driver API dùng chung một listener và CSMS từ chối bind khác
      # loopback trừ khi có xác nhận này. An toàn vì hai điều kiện ở trên (publish chỉ ra 127.0.0.1,
      # Caddy không proxy console). Gỡ xác nhận này sẽ làm CSMS không khởi động được trong container.
      CONSOLE_ALLOW_NON_LOOPBACK: 'true'
      CONSOLE_PORT: '3000'
      # PHẢI false trên staging: trụ không có credential bị 401 (Security Profile 2). Cố định ở
      # đây, không đọc từ .env, để không bật nhầm.
      ALLOW_LEGACY_NO_CREDENTIAL: 'false'
      # PHẢI true: Caddy là proxy duy nhất (cổng 9000 chỉ `expose` trong mạng compose), nên bộ giới
      # hạn đăng nhập sai của trụ (#40) lấy IP trụ từ X-Forwarded-For. Thiếu dòng này mọi trụ chung
      # IP của Caddy → 5 lần sai mật khẩu của kẻ lạ khoá luôn trụ thật, 20 lần khoá mọi trụ.
      # Cố định ở đây, không đọc từ .env.
      OCPP_TRUST_PROXY: 'true'
      OFFLINE_GRACE_S: ${OFFLINE_GRACE_S:-120}
      OCPP_HEARTBEAT_INTERVAL_SECONDS: ${OCPP_HEARTBEAT_INTERVAL_SECONDS:-300}
      SESSION_START_TIMEOUT_S: ${SESSION_START_TIMEOUT_S:-120}
      SESSION_HARD_CAP_H: ${SESSION_HARD_CAP_H:-24}
      REPLAY_SKEW_THRESHOLD_S: ${REPLAY_SKEW_THRESHOLD_S:-5}
      TARIFF_CLOCK_TOLERANCE_S: ${TARIFF_CLOCK_TOLERANCE_S:-300}
      METER_VALUE_SAMPLE_INTERVAL_S: ${METER_VALUE_SAMPLE_INTERVAL_S:-10}
      REMOTE_STOP_RETRY_MAX: ${REMOTE_STOP_RETRY_MAX:-3}
      REMOTE_STOP_RETRY_INTERVAL_S: ${REMOTE_STOP_RETRY_INTERVAL_S:-30}
      RECONCILE_GAP_FACTOR: ${RECONCILE_GAP_FACTOR:-3}
      RECONCILE_ENERGY_TOLERANCE_WH: ${RECONCILE_ENERGY_TOLERANCE_WH:-1}
      # BE-27: Driver API (app tài xế, /api/driver/v1) dùng chung listener cổng 3000 với console, nên
      # cũng chỉ ra loopback VPS và tới được bằng SSH tunnel (DEV-ACCESS.md). Ba biến JWT đi cùng
      # nhau: để trống cả ba thì CSMS vẫn chạy và /api/driver trả 503 auth_unavailable; đặt thiếu một
      # cái thì CSMS không khởi động (check_env trong lib.sh chặn trước khi deploy). Sinh bằng
      # ./init-env.sh (hoặc ./init-env.sh --add-missing cho .env cũ).
      DRIVER_API_JWT_SECRET_BASE64: ${DRIVER_API_JWT_SECRET_BASE64:-}
      DRIVER_API_JWT_ISSUER: ${DRIVER_API_JWT_ISSUER:-}
      DRIVER_API_JWT_AUDIENCE: ${DRIVER_API_JWT_AUDIENCE:-}
      # Refresh token sống bao lâu (giây, 3600..7776000); mặc định 30 ngày như code.
      DRIVER_API_REFRESH_TTL_S: ${DRIVER_API_REFRESH_TTL_S:-2592000}
      # PHẢI false trên staging: true cho phép giả danh tài xế bằng header X-Driver-Id (chỉ dành cho
      # máy dev). Cố định ở đây, không đọc từ .env.
      DRIVER_API_DEV_AUTH: 'false'
      # T128 (FE-01a, ADR-0018): đăng nhập dashboard (/api/auth/v1/login, /api/operator/v1/*,
      # /api/admin/v1/*) — cùng listener cổng 3000, nên cũng chỉ qua SSH tunnel. Khoá RIÊNG, khác
      # Driver API. Cùng luật ba-biến: trống cả ba → 503 auth_unavailable; thiếu một hoặc khoá không
      # phải base64 chuẩn >= 32 byte → CSMS không khởi động (check_env chặn trước). Sinh bằng
      # ./init-env.sh (hoặc --add-missing cho .env cũ).
      DASHBOARD_JWT_SECRET_BASE64: ${DASHBOARD_JWT_SECRET_BASE64:-}
      DASHBOARD_JWT_ISSUER: ${DASHBOARD_JWT_ISSUER:-}
      DASHBOARD_JWT_AUDIENCE: ${DASHBOARD_JWT_AUDIENCE:-}
      # WF-05 (T119, #111): người thao tác các route onboarding của console (đăng ký trụ, onboard).
      # Là id user lấy từ log seed ("WF-05 console actors: ..."), KHÔNG lấy từ body. Trống → 503.
      CONSOLE_ACTOR_ADMIN_ID: ${CONSOLE_ACTOR_ADMIN_ID:-}
      CONSOLE_ACTOR_STAFF_ID: ${CONSOLE_ACTOR_STAFF_ID:-}
      # T32 Phần 5/6 (WF-02 D2/D8): VNPay sandbox. Secret chỉ nằm trong .env trên VM, không ghi
      # vào repo. Trống → tạo top-up trả 503 payment_unconfigured, IPN trả RspCode 99 (VNPay gọi lại).
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_URL: ${VNPAY_URL:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      # MB-03: khoá Vietmap phía server cho /places/* và /stations/{id}/route (khác khoá tile của app).
      # Secret: chỉ nằm trong .env trên VM. Trống → các route đó báo lỗi nhà cung cấp, phần còn lại vẫn chạy.
      VIETMAP_SEARCH_API_KEY: ${VIETMAP_SEARCH_API_KEY:-}
    ports:
      - '127.0.0.1:3000:3000' # console — chỉ loopback của VPS, truy cập bằng SSH tunnel
    expose:
      - '9000' # OCPP-J, chỉ trong mạng compose; Caddy proxy /ocpp/* tới đây
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # BE-27: publish CHỈ ra loopback của VPS, để dev xem/sửa dữ liệu staging qua SSH tunnel
    # (DEV-ACCESS.md: user `devtunnel` chỉ được forward tới 127.0.0.1:5432 và 127.0.0.1:3000).
    # Internet vẫn đóng: (1) Docker gắn cổng vào 127.0.0.1, không phải 0.0.0.0; (2) NSG của Azure chỉ
    # mở 22/80/443. Đừng đổi thành '5432:5432' — Docker tự mở iptables, vượt qua ufw.
    # Dev dùng role riêng `app_dev` (không superuser), không dùng POSTGRES_USER.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  # Trụ D1 giả lập có HMI, cho demo. Bật: docker compose --profile sim up -d simulator
  simulator:
    profiles: ['sim']
    image: ${REGISTRY}/powerme-simulator:${TAG}
    restart: unless-stopped
    environment:
      # Mặc định đi qua Caddy thật (TLS + Basic Auth). Nếu VPS không tự nối được tới IP công khai
      # của nó (hairpin NAT), đặt SIM_CSMS_URL=ws://csms:9000/ocpp trong .env (README.md).
      CSMS_URL: ${SIM_CSMS_URL:-wss://${DOMAIN}/ocpp}
      CP_ID: RH24D1-00001
      # Tên cũ DEMO_PILLAR_PASSWORD (trước T92) vẫn dùng được khi tên mới trống.
      CP_PASSWORD: ${DEMO_CHARGE_POINT_PASSWORD:-${DEMO_PILLAR_PASSWORD:-}}
      # HMI chưa có xác thực — cùng nguyên tắc với console: bind 0.0.0.0 trong container,
      # chỉ publish ra 127.0.0.1 của máy chủ, truy cập bằng SSH tunnel.
      HMI_HOST: 0.0.0.0
      HMI_PORT: '8100'
    ports:
      - '127.0.0.1:8100:8100'
    depends_on:
      csms:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
