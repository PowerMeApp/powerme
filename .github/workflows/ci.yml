name: CI

on:
  push:
    branches: [main]
  # KHÔNG lọc theo nhánh đích: PR xếp tầng (nhánh này dựa trên nhánh kia)
  # cũng phải được kiểm. Lọc [main] khiến chúng không chạy check nào.
  pull_request:

# PR đẩy commit mới thì huỷ lượt chạy cũ — tiết kiệm phút Actions
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: powerme
          POSTGRES_PASSWORD: powerme
          POSTGRES_DB: powerme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U powerme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://powerme:powerme@localhost:5432/powerme_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm tra định dạng
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: MB03 isolated Driver HTTP integration
        run: npm run test:driver-discovery -w @powerme/csms
        env:
          MB03_TEST_ADMIN_DATABASE_URL: postgresql://powerme:powerme@127.0.0.1:5432/postgres
          MB03_ALLOW_CREATE_TEST_DATABASE: 'true'

      - name: Build
        run: npm run build

  # App tài xế (Flutter) nằm ngoài npm workspaces nên job trên không chạm tới.
  # Ghim đúng phiên bản trong apps/mobile/.metadata (3.44.2 = c9a6c484).
  flutter:
    name: Flutter · Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Phiên bản Flutter
        run: flutter --version

      # pubspec khai báo asset config/vietmap.local.json nhưng file bị ignore
      # (chứa key). Làm đúng bước README của app: copy từ bản mẫu, key rỗng.
      - name: Tạo cấu hình Vietmap rỗng
        run: cp config/vietmap.example.json config/vietmap.local.json

      - name: Cài phụ thuộc
        run: flutter pub get

      # Ba bước dưới độc lập: format đỏ vẫn cho analyze và test chạy
      # để PR nhận đủ ba kết quả trong một lượt.
      - name: Kiểm tra định dạng
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: ${{ !cancelled() }}
        run: flutter analyze

      - name: Test
        if: ${{ !cancelled() }}
        run: flutter test
