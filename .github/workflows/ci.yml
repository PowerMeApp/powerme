name: CI

on:
  push:
    branches: [main]
  # KHÔNG lọc theo nhánh đích: PR xếp tầng (nhánh này dựa trên nhánh kia)
  # cũng phải được kiểm. Lọc [main] khiến chúng không chạy check nào.
  pull_request:

# PR đẩy commit mới thì huỷ lượt chạy cũ — tiết kiệm phút Actions
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: powerme
          POSTGRES_PASSWORD: powerme
          POSTGRES_DB: powerme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U powerme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://powerme:powerme@localhost:5432/powerme_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm tra định dạng
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
